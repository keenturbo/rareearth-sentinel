<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 社媒文案</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.column{display:flex;flex-direction:column;gap:16px}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.section-title{font-weight:600;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:240px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;color:#0b1220;resize:vertical;background:#f9fbff}
.actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-status{font-size:12px;color:var(--muted)}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 社媒文案</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/orders/">报告</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/sources/">信源</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <div class="grid">
    <div class="column">
      <section class="section">
        <div class="section-title">中文外链版（引流）</div>
        <div class="meta">适合雪球 / 微博 / 公众号 · 钩子 + 风险提示 + 链接</div>
        <textarea id="copy-cn-link" readonly>{{SOCIAL_COPY_CN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-link" data-status="status-cn-link">复制外链版</button>
          <span class="copy-status" id="status-cn-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">中文私信版（引流）</div>
        <div class="meta">禁外链场景 · 钩子 + 风险提示 + 私信承接</div>
        <textarea id="copy-cn-dm" readonly>{{SOCIAL_COPY_CN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-dm" data-status="status-cn-dm">复制私信版</button>
          <span class="copy-status" id="status-cn-dm"></span>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="section">
        <div class="section-title">English (Hook + Link)</div>
        <div class="meta">For LinkedIn / X · Hook + risk note + link</div>
        <textarea id="copy-en-link" readonly>{{SOCIAL_COPY_EN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-link" data-status="status-en-link">Copy Link Version</button>
          <span class="copy-status" id="status-en-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">English (Hook + DM)</div>
        <div class="meta">No link · short DM funnel version</div>
        <textarea id="copy-en-dm" readonly>{{SOCIAL_COPY_EN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-dm" data-status="status-en-dm">Copy DM Version</button>
          <span class="copy-status" id="status-en-dm"></span>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  const clean = (s='') => String(s || '')
    .replace(/\r/g, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/。\s*[；;]/g, '。')
    .replace(/([。！？!?])\s*[；;]/g, '$1')
    .replace(/\.\s*;/g, '.')
    .replace(/\s+/g, ' ')
    .trim();

  const stripNoise = (s='') => clean(s)
    .replace(/\bTL\s*;\s*DR\s*:\s*/ig, '')
    .replace(/\bKey\s*angles?\s*:\s*/ig, '')
    .replace(/^\s*(要点|三视角|Three angles|Conclusion|核心结论|Report includes|Evidence anchors?|证据锚点|机会窗口|Opportunity window|影响路径|Impact path)\s*[:：]?\s*/i, '')
    .replace(/^\s*[•\-\*\u2022]+\s*/g, '')
    .replace(/(影响路径|Impact path)\s*[:：].*$/i, '')
    .replace(/(?:\.\.\.|…)\s*$/g, '')
    .trim();

  const lines = (raw='') => String(raw || '').split('\n').map(x => x.trim()).filter(Boolean);

  const getField = (arr, keys=[]) => {
    for (const l of arr) {
      for (const k of keys) {
        if (l.startsWith(k)) return stripNoise(l.slice(k.length));
      }
    }
    return '';
  };

  const getLink = (raw='') => {
    const m = String(raw || '').match(/https?:\/\/\S+/);
    return m ? m[0] : '';
  };

  const splitBullets = (s='') => {
    const raw = stripNoise(s);
    if (!raw) return [];
    if (!raw.includes('•')) return [raw];
    return raw.split('•').map(x => stripNoise(x)).filter(Boolean);
  };

  const splitSentCn = (s='') => stripNoise(s).split(/[。！？；;]+/).map(x => stripNoise(x)).filter(Boolean);

  const splitSentEn = (s='') => {
    const t = stripNoise(s)
      .replace(/(\d)\.(\d)/g, '$1__DOT__$2')
      .replace(/\bU\.S\./g, 'US')
      .replace(/\bU\.K\./g, 'UK')
      .replace(/\be\.g\./ig, 'eg')
      .replace(/\bi\.e\./ig, 'ie');
    return t.split(/[.!?;]+/).map(x => stripNoise(x.replace(/__DOT__/g,'.'))).filter(Boolean);
  };

  const isAdvice = (s='') => /(减持|增配|超配|规避|建议|布局|关注|谨慎|买入|卖出|加仓|建仓|止盈|止损|avoid|overweight|underweight|buy|sell|trim|add position|reduce exposure|not investment advice)/i.test(s);
  const isFactCn = (s='') => /(\d|亿美元|亿元|万吨|项目|协议|注资|投资|储备|贷款|股权|国防部|商务部)/.test(s);
  const isFactEn = (s='') => /(\d|\$|billion|million|project|agreement|funding|investment|loan|equity|stockpile|reserve|department|ministry|announced|approved)/i.test(s);
  const isBadTailEn = (s='') => /(?:\.\.\.|…|\bhedg(?:e|ing)?|\bto)\s*$/i.test(s);
  const isActionLeadEn = (s='') => /^(secure|track|watch|rebalance|hedge|buy|sell|trim|add|reduce|avoid|overweight|underweight|prioritize|focus on|rotate|accumulate|de-risk)\b/i.test(s);

  const norm = (s='') => stripNoise(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
  const similar = (a,b) => {
    const x = norm(a), y = norm(b);
    if (!x || !y) return false;
    return x === y || x.includes(y) || y.includes(x) || x.slice(0,28) === y.slice(0,28);
  };

  const clipCn = (s='', n=36) => {
    const t = stripNoise(s);
    if (!t) return '';
    return t.length > n ? t.slice(0, n).replace(/[，。；;,\s]+$/g, '') : t;
  };

  const clipWords = (s='', n=20) => {
    const t = stripNoise(s).replace(/(?:\.\.\.|…)\s*$/g, '').trim();
    if (!t) return '';
    const ws = t.split(/\s+/);
    return ws.length > n ? ws.slice(0,n).join(' ').replace(/[;,\.\s]+$/g,'') : t;
  };

  const pickFactCn = (...texts) => {
    const pool = texts.flatMap(t => splitSentCn(t || '')).map(stripNoise).filter(Boolean);
    return pool.find(x => isFactCn(x) && !isAdvice(x)) || pool.find(x => !isAdvice(x)) || '';
  };

  const pickFactEn = (...texts) => {
    const pool = texts.flatMap(t => splitSentEn(t || '')).map(stripNoise).filter(Boolean)
      .filter(x => !isAdvice(x) && !isActionLeadEn(x) && !isBadTailEn(x));
    return pool.find(isFactEn) || pool[0] || '';
  };

  const pickAngles = (rawPolicy, rawIndustry, rawCapital, lang='cn') => {
    const src = [rawPolicy, rawIndustry, rawCapital].map(x => splitBullets(x || ''));
    const out = [];
    for (let i=0;i<3;i++) {
      let cand = '';
      for (const v of src[i]) {
        const c = stripNoise(v);
        if (!c) continue;
        if (out.some(o => similar(o, c))) continue;
        cand = c; break;
      }
      if (!cand) {
        for (const arr of src) {
          for (const v of arr) {
            const c = stripNoise(v);
            if (!c) continue;
            if (out.some(o => similar(o, c))) continue;
            cand = c; break;
          }
          if (cand) break;
        }
      }
      out.push(cand || '');
    }
    if (lang === 'cn') return out.map(x => clipCn(x, 34));
    return out.map(x => clipWords(x, 16));
  };

  const makeCn = (raw, withLink=true) => {
    const arr = lines(raw || '');
    if (!arr.length) return '';

    const coreRaw = getField(arr, ['核心结论：','Conclusion:']) || arr[0].replace(/^【.*?】/, '');
    const pRaw = getField(arr, ['📜 政策：','📜 Policy:']);
    const iRaw = getField(arr, ['🏭 产业：','🏭 Industry:']);
    const cRaw = getField(arr, ['💰 资本：','💰 Capital:']);
    const oppRaw = getField(arr, ['机会窗口：','Opportunity window:']);
    const evRaw = getField(arr, ['证据锚点：','Evidence anchors:']);
    const incRaw = getField(arr, ['报告包含：','Report includes:']);
    const link = getLink(raw);

    let [policy, industry, capital] = pickAngles(pRaw, iRaw, cRaw, 'cn');
    const fallback = pickFactCn(incRaw, evRaw, coreRaw, pRaw, iRaw, cRaw) || '关键矿产链条重构正在加速。';
    if (!policy) policy = clipCn(pickFactCn(pRaw, coreRaw) || fallback, 34);
    if (!industry) industry = clipCn(pickFactCn(iRaw, incRaw) || fallback, 34);
    if (!capital) capital = clipCn(pickFactCn(cRaw, incRaw) || fallback, 34);

    const title = clipCn(coreRaw, 26);
    const coreFact = clipCn(pickFactCn(policy, industry, capital, coreRaw) || fallback, 36);
    let impact = clipCn(pickFactCn(industry, policy, incRaw) || fallback, 36);
    if (similar(impact, coreFact)) impact = clipCn(pickFactCn(incRaw, policy, capital) || '供应链重排速度提升。', 36);
    let action = clipCn(pickFactCn(coreRaw, oppRaw), 42);
    if (!action || !/(跟踪|观察|评估|控制|分散|配置|对冲|仓位|窗口)/.test(action)) {
      action = '优先跟踪政策资金与加工产能兑现节点。';
    }
    let counter = clipCn(pickFactCn(oppRaw, incRaw), 42);
    if (!counter) counter = '若海外供给兑现慢于预期，短期波动会放大。';
    let evidence = clipCn(pickFactCn(evRaw, incRaw, policy, industry, capital), 46);
    if (!evidence || isAdvice(evidence)) evidence = clipCn(fallback, 46);

    const out = [
      `【战争金属信号】${title}`,
      `核心事实：${coreFact}`,
      `影响路径：${impact}`,
      `投资动作：${action}`,
      `反方风险：${counter}`,
      `证据锚点：${evidence}`,
      '⚠️ 风险提示：不构成投资建议，请按风险承受能力决策。'
    ];

    if (withLink && link) out.push('', '👉 完整版：', link);
    out.push('私信回复【稀土】获取完整版', '#稀土 #关键矿产 #供应链');
    return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  };

  const makeEn = (raw, withLink=true) => {
    const arr = lines(raw || '');
    if (!arr.length) return '';

    const coreRaw = getField(arr, ['Conclusion:','核心结论：']) || arr[0];
    const pRaw = getField(arr, ['📜 Policy:','📜 政策：']);
    const iRaw = getField(arr, ['🏭 Industry:','🏭 产业：']);
    const cRaw = getField(arr, ['💰 Capital:','💰 资本：']);
    const oppRaw = getField(arr, ['Opportunity window:','机会窗口：']);
    const evRaw = getField(arr, ['Evidence anchors:','Evidence anchor:','证据锚点：']);
    const incRaw = getField(arr, ['Report includes:','报告包含：']);
    const link = getLink(raw);

    let [policy, industry, capital] = pickAngles(pRaw, iRaw, cRaw, 'en');
    const fallback = clipWords(pickFactEn(incRaw, evRaw, coreRaw, pRaw, iRaw, cRaw) || 'DoD-backed funding and stockpile programs are accelerating processing build-out.', 20);
    if (!policy) policy = clipWords(pickFactEn(pRaw, coreRaw) || fallback, 14);
    if (!industry) industry = clipWords(pickFactEn(iRaw, incRaw) || fallback, 14);
    if (!capital) capital = clipWords(pickFactEn(cRaw, incRaw) || fallback, 14);

    const title = clipWords(coreRaw, 12);
    const coreFact = clipWords(pickFactEn(coreRaw, policy, industry, capital) || fallback, 18);
    let impact = clipWords(pickFactEn(industry, policy, incRaw) || fallback, 18);
    if (similar(impact, coreFact)) impact = clipWords(pickFactEn(incRaw, policy, capital) || 'Supply-chain bottlenecks are shifting downstream.', 18);

    let action = clipWords(pickFactEn(coreRaw, oppRaw), 22);
    if (!action || !/(track|watch|rebalance|hedge|position|window|trigger)/i.test(action)) {
      action = 'Track funding, processing ramp-up, and trigger levels before sizing positions';
    }

    let counter = clipWords(pickFactEn(oppRaw, incRaw), 22);
    if (!counter) counter = 'If project delivery lags, volatility can rise before fundamentals catch up';

    let evidence = clipWords(pickFactEn(evRaw, incRaw, policy, industry, capital), 24)
      .replace(/\bhedg(?:e|ing)?\b\s*$/i, '')
      .replace(/\bto\b\s*$/i, '')
      .trim();
    if (!evidence || isAdvice(evidence) || isActionLeadEn(evidence) || isBadTailEn(evidence) || similar(evidence, impact) || similar(evidence, coreFact)) {
      evidence = clipWords(pickFactEn(incRaw, policy, industry, capital, coreRaw) || fallback, 24);
    }

    const out = [
      `War-Metal Signal: ${title}`,
      `Core fact: ${coreFact || fallback}`,
      `Impact path: ${impact || 'Supply-chain bottlenecks are shifting downstream'}`,
      `Investor action: ${action}`,
      `Counter-risk: ${counter}`,
      `Evidence anchor: ${evidence}`,
      '⚠️ Risk note: Not investment advice. Manage triggers and position size.'
    ];

    if (withLink && link) out.push('', 'Full brief:', link);
    out.push('DM for full report', '#RareEarth #CriticalMinerals #SupplyChain');
    return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  };

  try {
    const cnLink = document.getElementById('copy-cn-link');
    const cnDm = document.getElementById('copy-cn-dm');
    const enLink = document.getElementById('copy-en-link');
    const enDm = document.getElementById('copy-en-dm');

    if (cnLink) cnLink.value = makeCn(cnLink.value, true);
    if (cnDm) cnDm.value = makeCn(cnDm.value, false);
    if (enLink) enLink.value = makeEn(enLink.value, true);
    if (enDm) enDm.value = makeEn(enDm.value, false);
  } catch (e) {
    console.error('social copy transform failed', e);
  }

  const buttons = document.querySelectorAll('[data-copy]');
  const copyText = async (text) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    return false;
  };

  buttons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copy);
      const status = document.getElementById(btn.dataset.status);
      if (!target) return;

      const setStatus = (msg) => {
        if (!status) return;
        status.textContent = msg;
        setTimeout(() => { status.textContent = ''; }, 2000);
      };

      try {
        const ok = await copyText(target.value || '');
        if (ok) return setStatus('已复制');
      } catch (_) {}

      target.focus();
      target.select();
      try {
        document.execCommand('copy');
        setStatus('已复制');
      } catch (_) {
        setStatus('复制失败');
      }
    });
  });
})();
</script>
</body>
</html>
