<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 社媒文案</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.column{display:flex;flex-direction:column;gap:16px}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.section-title{font-weight:600;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:240px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;color:#0b1220;resize:vertical;background:#f9fbff}
.actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-status{font-size:12px;color:var(--muted)}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 社媒文案</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/orders/">报告</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/sources/">信源</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <div class="grid">
    <div class="column">
      <section class="section">
        <div class="section-title">中文外链版</div>
        <div class="meta">适合雪球 / 微博 / 公众号 · 含链接 + 私信提示</div>
        <textarea id="copy-cn-link" readonly>{{SOCIAL_COPY_CN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-link" data-status="status-cn-link">复制外链版</button>
          <span class="copy-status" id="status-cn-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">中文私信版</div>
        <div class="meta">适合雪球禁外链场景 · 无链接版本</div>
        <textarea id="copy-cn-dm" readonly>{{SOCIAL_COPY_CN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-dm" data-status="status-cn-dm">复制私信版</button>
          <span class="copy-status" id="status-cn-dm"></span>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="section">
        <div class="section-title">English (With Link)</div>
        <div class="meta">For LinkedIn / X · Includes link + DM line</div>
        <textarea id="copy-en-link" readonly>{{SOCIAL_COPY_EN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-link" data-status="status-en-link">Copy Link Version</button>
          <span class="copy-status" id="status-en-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">English (DM Version)</div>
        <div class="meta">No link · Short version for LinkedIn / X</div>
        <textarea id="copy-en-dm" readonly>{{SOCIAL_COPY_EN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-dm" data-status="status-en-dm">Copy DM Version</button>
          <span class="copy-status" id="status-en-dm"></span>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  const ADVISORY_ZH = ['警惕','减持','建议','布局','关注','谨慎','增配','回避'];

  const cleanPunct = (s) => (s || '')
    .replace(/。\s*[；;]/g, '。')
    .replace(/([。！？!?])\s*[；;]/g, '$1')
    .replace(/\.{1}\s*;/g, '.')
    .replace(/；\s*；+/g, '；')
    .replace(/;\s*;+/g, ';')
    .replace(/\s+/g, ' ')
    .trim();

  const stripNoise = (s) => {
    let t = (s || '').trim();
    t = t.replace(/\bTL\s*;\s*DR\s*:\s*/ig, '');
    t = t.replace(/^\s*(Policy|Industry|Capital|要点|三视角|Key angles?)\s*[:：]\s*/ig, '');
    t = t.replace(/^[•\-\*\u2022]+\s*/g, '');
    t = t.replace(/\b(Impact path|影响路径)\s*[:：].*$/i, '');
    return cleanPunct(t);
  };

  const splitFacts = (line, lang='zh') => {
    const body = stripNoise((line || '').replace(/^\s*(报告包含|Report includes)\s*[:：]\s*/i, ''));
    const rawParts = body.split(/[•\n。；;.!?]/).map(x => stripNoise(x)).filter(Boolean);
    const out = [];
    for (const p of rawParts) {
      if (!/\d/.test(p)) continue;
      if (lang === 'zh' && ADVISORY_ZH.some(k => p.includes(k))) continue;
      if (out.some(x => x === p || x.includes(p) || p.includes(x))) continue;
      out.push(p);
      if (out.length >= 3) break;
    }
    return out;
  };

  const linesOf = (text) => (text || '').split('\n');
  const joinLines = (arr) => arr.map(x => cleanPunct(x)).join('\n').replace(/\n{3,}/g, '\n\n').trim();

  const findLine = (lines, prefix) => {
    const idx = lines.findIndex(l => l.startsWith(prefix));
    if (idx < 0) return { idx: -1, value: '' };
    return { idx, value: stripNoise(lines[idx].slice(prefix.length)) };
  };

  const setLine = (lines, prefix, value) => {
    const i = lines.findIndex(l => l.startsWith(prefix));
    if (i >= 0) lines[i] = `${prefix}${stripNoise(value)}`;
  };

  const normForCompare = (s) => stripNoise(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
  const similar = (a, b) => {
    const x = normForCompare(a);
    const y = normForCompare(b);
    if (!x || !y) return false;
    if (x === y || x.includes(y) || y.includes(x)) return true;
    const min = Math.min(x.length, y.length);
    if (min < 8) return false;
    return x.slice(0, 24) === y.slice(0, 24);
  };

  const clipZh = (s, n=60) => {
    const t = stripNoise(s);
    if (!t) return '';
    return t.length > n ? `${t.slice(0, n).replace(/[，。；;,.\s]+$/g, '')}…` : t;
  };

  const clipEnWords = (s, n=20) => {
    const t = stripNoise(s);
    if (!t) return '';
    const ws = t.split(/\s+/);
    return ws.length > n ? `${ws.slice(0, n).join(' ').replace(/[;,.\s]+$/g, '')}...` : t;
  };

  const normalizeCnBlock = (text) => {
    let lines = linesOf(text).map(stripNoise);

    const policy = findLine(lines, '📜 政策：');
    const industry = findLine(lines, '🏭 产业：');
    const capital = findLine(lines, '💰 资本：');
    const includes = findLine(lines, '报告包含：');
    const evidence = findLine(lines, '证据锚点：');
    const facts = splitFacts(includes.value, 'zh');

    if (!capital.value) {
      const fill = facts[0] || industry.value || policy.value || '关注资金与估值变化。';
      setLine(lines, '💰 资本：', clipZh(fill));
    }

    if (!policy.value && industry.value) setLine(lines, '📜 政策：', clipZh(industry.value));
    if (!industry.value && policy.value) setLine(lines, '🏭 产业：', clipZh(policy.value));

    const p2 = findLine(lines, '📜 政策：').value;
    const i2 = findLine(lines, '🏭 产业：').value;
    const c2 = findLine(lines, '💰 资本：').value;

    if (similar(i2, p2) && facts[1]) setLine(lines, '🏭 产业：', clipZh(facts[1]));
    if ((similar(c2, p2) || similar(c2, findLine(lines, '🏭 产业：').value)) && facts[0]) {
      const alt = facts.find(f => !similar(f, p2) && !similar(f, findLine(lines, '🏭 产业：').value)) || facts[0];
      setLine(lines, '💰 资本：', clipZh(alt));
    }

    const ev = evidence.value;
    if (evidence.idx >= 0) {
      const advisory = ADVISORY_ZH.some(k => ev.includes(k));
      const hasNum = /\d/.test(ev);
      if (!ev || advisory || !hasNum) {
        const replacement = facts.slice(0,2).join('；') || clipZh(includes.value, 90);
        if (replacement) setLine(lines, '证据锚点：', replacement);
      }
    }

    lines = lines.map(line => line.replace(/^要点\s*[:：]\s*$/,'要点'));
    return joinLines(lines);
  };

  const normalizeEnBlock = (text) => {
    let lines = linesOf(text).map(stripNoise);

    const policy = findLine(lines, '📜 Policy:');
    const industry = findLine(lines, '🏭 Industry:');
    const capital = findLine(lines, '💰 Capital:');
    const includes = findLine(lines, 'Report includes:');
    const facts = splitFacts(includes.value, 'en').map(x => clipEnWords(x, 16));

    const p = clipEnWords(policy.value, 20);
    let i = clipEnWords(industry.value, 20);
    let c = clipEnWords(capital.value, 20);

    if (!i) i = facts[0] || p;
    if (!c) c = facts[1] || facts[0] || i || p;

    if (similar(i, p)) {
      const alt = facts.find(f => !similar(f, p));
      if (alt) i = alt;
    }
    if (similar(c, p) || similar(c, i)) {
      const alt = facts.find(f => !similar(f, p) && !similar(f, i));
      if (alt) c = alt;
    }

    if (!i) i = 'Domestic processing and magnet capacity become the bottleneck.';
    if (!c) c = 'Valuation and funding pressure are moving to downstream processing assets.';

    setLine(lines, '📜 Policy:', p);
    setLine(lines, '🏭 Industry:', i);
    setLine(lines, '💰 Capital:', c);

    return joinLines(lines);
  };

  const normalizeTextarea = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = fn(el.value || '');
  };

  normalizeTextarea('copy-cn-link', normalizeCnBlock);
  normalizeTextarea('copy-cn-dm', normalizeCnBlock);
  normalizeTextarea('copy-en-link', normalizeEnBlock);
  normalizeTextarea('copy-en-dm', normalizeEnBlock);

  const buttons = document.querySelectorAll('[data-copy]');
  if (!buttons.length) return;

  const copyText = async (text) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    return false;
  };

  buttons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      const targetId = btn.dataset.copy;
      const statusId = btn.dataset.status;
      const target = document.getElementById(targetId);
      const status = document.getElementById(statusId);
      if (!target) return;
      const text = target.value || '';
      const setStatus = (msg) => {
        if (!status) return;
        status.textContent = msg;
        setTimeout(() => { status.textContent = ''; }, 2000);
      };
      try {
        const ok = await copyText(text);
        if (ok) {
          setStatus('已复制');
          return;
        }
      } catch (err) {
      }
      target.focus();
      target.select();
      try {
        document.execCommand('copy');
        setStatus('已复制');
      } catch (err) {
        setStatus('复制失败');
      }
    });
  });
})();
</script>
</body>
</html>
