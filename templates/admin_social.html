<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 社媒文案</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.column{display:flex;flex-direction:column;gap:16px}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.section-title{font-weight:600;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:240px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;color:#0b1220;resize:vertical;background:#f9fbff}
.actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-status{font-size:12px;color:var(--muted)}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 社媒文案</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/orders/">报告</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/sources/">信源</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <div class="grid">
    <div class="column">
      <section class="section">
        <div class="section-title">中文外链版（引流）</div>
        <div class="meta">适合雪球 / 微博 / 公众号 · 钩子 + 风险提示 + 链接</div>
        <textarea id="copy-cn-link" readonly>{{SOCIAL_COPY_CN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-link" data-status="status-cn-link">复制外链版</button>
          <span class="copy-status" id="status-cn-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">中文私信版（引流）</div>
        <div class="meta">禁外链场景 · 钩子 + 风险提示 + 私信承接</div>
        <textarea id="copy-cn-dm" readonly>{{SOCIAL_COPY_CN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-dm" data-status="status-cn-dm">复制私信版</button>
          <span class="copy-status" id="status-cn-dm"></span>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="section">
        <div class="section-title">English (Hook + Link)</div>
        <div class="meta">For LinkedIn / X · Hook + risk note + link</div>
        <textarea id="copy-en-link" readonly>{{SOCIAL_COPY_EN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-link" data-status="status-en-link">Copy Link Version</button>
          <span class="copy-status" id="status-en-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">English (Hook + DM)</div>
        <div class="meta">No link · short DM funnel version</div>
        <textarea id="copy-en-dm" readonly>{{SOCIAL_COPY_EN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-dm" data-status="status-en-dm">Copy DM Version</button>
          <span class="copy-status" id="status-en-dm"></span>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  const clean = (s='') => s
    .replace(/\r/g, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/。\s*[；;]/g, '。')
    .replace(/([。！？!?])\s*[；;]/g, '$1')
    .replace(/\.{1}\s*;/g, '.')
    .replace(/\s+/g, ' ')
    .trim();

  const stripNoise = (s='') => clean(s)
    .replace(/\bTL\s*;\s*DR\s*:\s*/ig, '')
    .replace(/\bKey\s*angles?\s*:\s*/ig, '')
    .replace(/^\s*(要点|三视角|Three angles|Conclusion|核心结论|Report includes|Evidence anchors|证据锚点|机会窗口|Opportunity window)\s*[:：]?\s*/i, '')
    .replace(/^[•\-*\u2022]+\s*/g, '')
    .replace(/(影响路径|Impact path)\s*[:：].*$/i, '')
    .trim();

  const splitLines = (raw='') => raw.split('\n').map(x => x.trim()).filter(Boolean);

  const getField = (lines, prefixes=[]) => {
    for (const line of lines) {
      for (const p of prefixes) {
        if (line.startsWith(p)) return stripNoise(line.slice(p.length));
      }
    }
    return '';
  };

  const getLink = (raw='') => {
    const m = raw.match(/https?:\/\/\S+/);
    return m ? m[0] : '';
  };

  const isAdvice = (s='') => /(减持|增配|超配|规避|建议|布局|关注|谨慎|买入|卖出|加仓|建仓|止盈|止损|avoid|overweight|underweight|buy|sell|trim|add position|reduce exposure|not investment advice)/i.test(s);
  const isActionLeadEn = (s='') => /^(secure|track|watch|rebalance|hedge|buy|sell|trim|add(?:\s+position)?|reduce(?:\s+exposure)?|avoid|overweight|underweight|prioritize|focus on|rotate|accumulate|de-risk)\b/i.test(stripNoise(s));
  const isTruncated = (s='') => /(?:\.\.\.|…)\s*$/.test((s || '').trim());
  const isFactEn = (s='') => /\d|\$|billion|million|project|agreement|funding|investment|loan|equity|stockpile|reserve|department|ministry|announced|approved/i.test(s);
  const looksIncompleteEn = (s='') => {
    const t = stripNoise(s);
    if (!t) return true;
    if (isTruncated(t)) return true;
    const words = t.split(/\s+/);
    if (words.length < 4) return true;
    return /\b(unprecedented|significant|material|notably|including|with|without|before|after|to|for|of|in|on|at|from|than|as|by|and|or|but|while|if)\s*$/i.test(t);
  };

  const splitSentencesCn = (s='') => stripNoise(s).split(/[。！？；;]+/).map(x => stripNoise(x)).filter(Boolean);

  const splitSentencesEn = (s='') => {
    let t = stripNoise(s)
      .replace(/(\d)\.(\d)/g, '$1__DOT__$2')
      .replace(/\bU\.S\./g, 'US')
      .replace(/\bU\.K\./g, 'UK')
      .replace(/\be\.g\./ig, 'eg')
      .replace(/\bi\.e\./ig, 'ie');
    const parts = t.split(/[.!?;]+/).map(x => stripNoise(x.replace(/__DOT__/g,'.'))).filter(Boolean);
    return parts;
  };

  const firstFactCn = (text='') => {
    const parts = splitSentencesCn(text);
    const fact = parts.find(x => /\d|亿美元|亿股|万吨|项目|协议|注资|投资|储备|贷款|股权/.test(x) && !isAdvice(x));
    return fact || parts.find(x => !isAdvice(x)) || '';
  };

  const firstFactEn = (text='') => {
    const parts = splitSentencesEn(text);
    const fact = parts.find(x => /
      \d|\$|billion|million|project|agreement|funding|investment|loan|equity|stockpile|reserve/i.test(x)
      && !isAdvice(x)
      && !isActionLeadEn(x)
      && !looksIncompleteEn(x)
    );
    return (
      fact ||
      parts.find(x => !isAdvice(x) && !isActionLeadEn(x) && !looksIncompleteEn(x)) ||
      parts.find(x => !isAdvice(x) && !isActionLeadEn(x) && !isTruncated(x)) ||
      ''
    );
  };

  const pickFactEn = (texts=[], deny=[]) => {
    const denyList = (deny || []).filter(Boolean);
    const candidates = [];
    for (const src of texts) {
      const parts = splitSentencesEn(src || '');
      for (const p of parts) {
        const t = stripNoise(p);
        if (!t) continue;
        if (isAdvice(t) || isActionLeadEn(t) || looksIncompleteEn(t)) continue;
        if (denyList.some(d => similar(t, d))) continue;
        candidates.push(t);
      }
    }
    const fact = candidates.find(c => isFactEn(c));
    return fact || candidates[0] || '';
  };

  const norm = (s='') => stripNoise(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
  const similar = (a,b) => {
    const x = norm(a), y = norm(b);
    if (!x || !y) return false;
    if (x === y || x.includes(y) || y.includes(x)) return true;
    return x.slice(0, 28) === y.slice(0, 28);
  };

  const clipCn = (s='', n=34) => {
    const t = stripNoise(s);
    if (!t) return '';
    return t.length > n ? `${t.slice(0, n).replace(/[，。；;,\s]+$/g, '')}…` : t;
  };

  const clipWords = (s='', n=15) => {
    const t = stripNoise(s);
    if (!t) return '';
    const ws = t.split(/\s+/);
    return ws.length > n ? `${ws.slice(0, n).join(' ').replace(/[;,.\s]+$/g,'')}...` : t;
  };

  const clipWordsNoEllipsis = (s='', n=20) => {
    const t = stripNoise(s).replace(/(?:\.\.\.|…)\s*$/g, '').trim();
    if (!t) return '';
    const ws = t.split(/\s+/);
    return ws.length > n ? ws.slice(0, n).join(' ').replace(/[;,.\s]+$/g,'') : t;
  };

  const makeCn = (raw, withLink=true) => {
    const lines = splitLines(raw || '');
    if (!lines.length) return '';

    const coreRaw = getField(lines, ['核心结论：','Conclusion:']) || lines[0];
    const policy = getField(lines, ['📜 政策：','📜 Policy:']);
    const industry = getField(lines, ['🏭 产业：','🏭 Industry:']);
    const capital = getField(lines, ['💰 资本：','💰 Capital:']);
    const oppRaw = getField(lines, ['机会窗口：','Opportunity window:']);
    const evidenceRaw = getField(lines, ['证据锚点：','Evidence anchors:']);
    const includesRaw = getField(lines, ['报告包含：','Report includes:']);
    const link = getLink(raw);

    const fallbackFact = firstFactCn(`${includesRaw}；${evidenceRaw}`) || '资金与产能重排正在加速。';

    let coreFact = firstFactCn(`${policy}；${industry}；${capital}`) || fallbackFact;
    let impact = firstFactCn(industry) || firstFactCn(policy) || fallbackFact;
    let action = firstFactCn(coreRaw);
    if (!action || !/(跟踪|观察|评估|控制|分散|配置|对冲|仓位|窗口)/.test(action)) {
      action = '投资动作：优先跟踪政策资金与加工产能兑现节点。';
    } else {
      action = `投资动作：${action}`;
    }
    let counter = firstFactCn(oppRaw) || '反方风险：若海外供给兑现慢于预期，短期波动会放大。';
    if (!counter.startsWith('反方风险')) counter = `反方风险：${counter}`;

    let evidence = firstFactCn(evidenceRaw) || firstFactCn(includesRaw) || fallbackFact;
    if (!evidence || isAdvice(evidence)) evidence = fallbackFact;

    coreFact = clipCn(coreFact, 34);
    impact = clipCn(impact, 34);
    if (similar(impact, coreFact)) impact = clipCn(firstFactCn(includesRaw) || '供给链从资源端向加工端迁移。', 34);
    evidence = clipCn(evidence, 44);
    const title = clipCn(coreRaw.replace(/^【.*?】/, ''), 30);

    const out = [
      `【战争金属信号】${title}`,
      `核心事实：${coreFact}`,
      `影响路径：${impact}`,
      action,
      counter,
      `证据锚点：${evidence}`,
      '⚠️ 风险提示：不构成投资建议，请按风险承受能力决策。'
    ];

    if (withLink && link) out.push('', '👉 完整版：', link);
    out.push('私信回复【稀土】获取完整版', '#稀土 #关键矿产 #供应链');
    return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  };

  const makeEn = (raw, withLink=true) => {
    const lines = splitLines(raw || '');
    if (!lines.length) return '';

    const coreRaw = getField(lines, ['Conclusion:','核心结论：']) || lines[0];
    const policy = getField(lines, ['📜 Policy:','📜 政策：']);
    const industry = getField(lines, ['🏭 Industry:','🏭 产业：']);
    const capital = getField(lines, ['💰 Capital:','💰 资本：']);
    const oppRaw = getField(lines, ['Opportunity window:','机会窗口：']);
    const evidenceRaw = getField(lines, ['Evidence anchors:','证据锚点：']);
    const includesRaw = getField(lines, ['Report includes:','报告包含：']);
    const link = getLink(raw);

    const fallbackFact = pickFactEn([includesRaw, evidenceRaw, policy, industry, capital, coreRaw]) || 'DoD-backed funding and stockpile programs are accelerating processing build-out.';

    let coreFact = pickFactEn([coreRaw, policy, industry, capital, includesRaw, evidenceRaw]) || fallbackFact;

    let impact = pickFactEn([industry, policy, capital, includesRaw], [coreFact]) || 'Supply-chain bottlenecks are shifting downstream.';
    if (similar(impact, coreFact) || looksIncompleteEn(impact)) {
      impact = pickFactEn([includesRaw, policy, capital, coreRaw], [coreFact]) || 'Supply-chain bottlenecks are shifting downstream.';
    }

    let action = pickFactEn([coreRaw], [coreFact, impact]) || firstFactEn(coreRaw);
    if (!action || !/(track|watch|rebalance|hedge|position|window|trigger)/i.test(action)) {
      action = 'Investor action: Track funding, processing ramp-up, and trigger levels before sizing positions.';
    } else if (!/^Investor action:/i.test(action)) {
      action = `Investor action: ${action}`;
    }

    let counter = pickFactEn([oppRaw], [coreFact, impact]) || 'Counter-risk: If project delivery lags, volatility can rise before fundamentals catch up.';
    if (!/^Counter-risk:/i.test(counter)) counter = `Counter-risk: ${counter}`;

    const factPool = [
      pickFactEn([evidenceRaw], [coreFact, impact, action]),
      pickFactEn([includesRaw], [coreFact, impact, action]),
      pickFactEn([policy, industry, capital], [coreFact, impact, action]),
      pickFactEn([coreRaw], [coreFact, impact, action]),
      fallbackFact
    ].filter(Boolean);

    let evidence =
      factPool.find(x => isFactEn(x) && !isAdvice(x) && !isActionLeadEn(x) && !looksIncompleteEn(x)) ||
      factPool.find(x => !isAdvice(x) && !isActionLeadEn(x) && !looksIncompleteEn(x)) ||
      fallbackFact;

    evidence = clipWordsNoEllipsis(evidence, 24)
      .replace(/\bhedg(?:e|ing)?\b\s*$/i, '')
      .replace(/\bto\s*$/i, '')
      .trim();

    if (!evidence || isAdvice(evidence) || isActionLeadEn(evidence) || looksIncompleteEn(evidence) || similar(evidence, impact) || similar(evidence, coreFact)) {
      const alt = pickFactEn([includesRaw, policy, industry, capital, coreRaw], [coreFact, impact]);
      evidence = clipWordsNoEllipsis(alt || fallbackFact, 24)
        .replace(/\bhedg(?:e|ing)?\b\s*$/i, '')
        .replace(/\bto\s*$/i, '')
        .trim();
    }

    const safeCore = clipWordsNoEllipsis(coreFact, 18);
    const safeImpact = clipWordsNoEllipsis(impact, 18);
    const safeAction = clipWordsNoEllipsis(action, 22);
    const safeCounter = clipWordsNoEllipsis(counter, 22);

    const out = [
      `War-Metal Signal: ${clipWords(coreRaw, 12)}`,
      `Core fact: ${safeCore || fallbackFact}`,
      `Impact path: ${safeImpact || 'Supply-chain bottlenecks are shifting downstream'}`,
      safeAction,
      safeCounter,
      `Evidence anchor: ${evidence}`,
      '⚠️ Risk note: Not investment advice. Manage triggers and position size.'
    ];

    if (withLink && link) out.push('', 'Full brief:', link);
    out.push('DM for full report', '#RareEarth #CriticalMinerals #SupplyChain');

    return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  };

  const cnLink = document.getElementById('copy-cn-link');
  const cnDm = document.getElementById('copy-cn-dm');
  const enLink = document.getElementById('copy-en-link');
  const enDm = document.getElementById('copy-en-dm');

  if (cnLink) cnLink.value = makeCn(cnLink.value, true);
  if (cnDm) cnDm.value = makeCn(cnDm.value, false);
  if (enLink) enLink.value = makeEn(enLink.value, true);
  if (enDm) enDm.value = makeEn(enDm.value, false);

  const buttons = document.querySelectorAll('[data-copy]');
  const copyText = async (text) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    return false;
  };

  buttons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copy);
      const status = document.getElementById(btn.dataset.status);
      if (!target) return;

      const setStatus = (msg) => {
        if (!status) return;
        status.textContent = msg;
        setTimeout(() => { status.textContent = ''; }, 2000);
      };

      try {
        const ok = await copyText(target.value || '');
        if (ok) return setStatus('已复制');
      } catch (_) {}

      target.focus();
      target.select();
      try {
        document.execCommand('copy');
        setStatus('已复制');
      } catch (_) {
        setStatus('复制失败');
      }
    });
  });
})();
</script>
</body>
</html>
