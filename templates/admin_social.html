<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 社媒文案</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.column{display:flex;flex-direction:column;gap:16px}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.section-title{font-weight:600;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:240px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;color:#0b1220;resize:vertical;background:#f9fbff}
.actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-status{font-size:12px;color:var(--muted)}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 社媒文案</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/orders/">报告</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/sources/">信源</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <div class="grid">
    <div class="column">
      <section class="section">
        <div class="section-title">中文外链版（引流）</div>
        <div class="meta">适合雪球 / 微博 / 公众号 · 钩子 + 风险提示 + 链接</div>
        <textarea id="copy-cn-link" readonly>{{SOCIAL_COPY_CN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-link" data-status="status-cn-link">复制外链版</button>
          <span class="copy-status" id="status-cn-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">中文私信版（引流）</div>
        <div class="meta">禁外链场景 · 钩子 + 风险提示 + 私信承接</div>
        <textarea id="copy-cn-dm" readonly>{{SOCIAL_COPY_CN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-dm" data-status="status-cn-dm">复制私信版</button>
          <span class="copy-status" id="status-cn-dm"></span>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="section">
        <div class="section-title">English (Hook + Link)</div>
        <div class="meta">For LinkedIn / X · Hook + risk note + link</div>
        <textarea id="copy-en-link" readonly>{{SOCIAL_COPY_EN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-link" data-status="status-en-link">Copy Link Version</button>
          <span class="copy-status" id="status-en-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">English (Hook + DM)</div>
        <div class="meta">No link · short DM funnel version</div>
        <textarea id="copy-en-dm" readonly>{{SOCIAL_COPY_EN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-dm" data-status="status-en-dm">Copy DM Version</button>
          <span class="copy-status" id="status-en-dm"></span>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  const clean = (s='') => s
    .replace(/\r/g, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/。\s*[；;]/g, '。')
    .replace(/([。！？!?])\s*[；;]/g, '$1')
    .replace(/\.{1}\s*;/g, '.')
    .replace(/\s+/g, ' ')
    .trim();

  const stripNoise = (s='') => clean(s)
    .replace(/\bTL\s*;\s*DR\s*:\s*/ig, '')
    .replace(/\bKey\s*angles?\s*:\s*/ig, '')
    .replace(/^\s*(要点|三视角|Three angles|Conclusion|核心结论|Report includes)\s*[:：]?\s*/i, '')
    .replace(/^[•\-*\u2022]+\s*/g, '')
    .replace(/(影响路径|Impact path)\s*[:：].*$/i, '')
    .trim();

  const parseLines = (raw='') => raw.split('\n').map(x => x.trim()).filter(Boolean);

  const getField = (lines, prefixes=[]) => {
    for (const line of lines) {
      for (const p of prefixes) {
        if (line.startsWith(p)) return stripNoise(line.slice(p.length));
      }
    }
    return '';
  };

  const getLink = (raw='') => {
    const m = raw.match(/https?:\/\/\S+/);
    return m ? m[0] : '';
  };

  const firstFact = (text='') => {
    const t = stripNoise(text);
    if (!t) return '';
    const parts = t.split(/[；;。.!?]/).map(x => stripNoise(x)).filter(Boolean);
    const fact = parts.find(x => /\d/.test(x)) || parts[0] || '';
    return fact;
  };

  const norm = (s='') => stripNoise(s).toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff]+/g, '');
  const similar = (a,b) => {
    const x = norm(a), y = norm(b);
    if (!x || !y) return false;
    if (x === y || x.includes(y) || y.includes(x)) return true;
    return x.slice(0, 24) === y.slice(0, 24);
  };

  const clipCn = (s='', n=32) => {
    const t = stripNoise(s);
    if (!t) return '';
    return t.length > n ? `${t.slice(0, n).replace(/[，。；;,\s]+$/g, '')}…` : t;
  };

  const clipWords = (s='', n=14) => {
    const t = stripNoise(s);
    if (!t) return '';
    const ws = t.split(/\s+/);
    return ws.length > n ? `${ws.slice(0, n).join(' ').replace(/[;,\.\s]+$/g,'')}...` : t;
  };

  const enforceCn220 = (lines, limit=220) => {
    let out = [...lines];
    const length = () => out.join('\n').length;
    const targets = [
      ['💰 资本：', 28],
      ['🏭 产业：', 28],
      ['📜 政策：', 28],
      ['【战争金属信号】', 24]
    ];
    for (const [prefix, n] of targets) {
      if (length() <= limit) break;
      const i = out.findIndex(x => x.startsWith(prefix));
      if (i >= 0) {
        const body = out[i].replace(prefix, '');
        out[i] = prefix + clipCn(body, n);
      }
    }
    if (length() > limit) {
      out = out.filter(x => !x.startsWith('#'));
    }
    return out;
  };

  const enforceEn120Words = (lines, limit=120) => {
    let out = [...lines];
    const wc = () => out.join(' ').split(/\s+/).filter(Boolean).length;
    const reduce = (prefix, n) => {
      const i = out.findIndex(x => x.startsWith(prefix));
      if (i >= 0) out[i] = `${prefix}${clipWords(out[i].slice(prefix.length), n)}`;
    };
    if (wc() > limit) reduce('💰 Capital: ', 10);
    if (wc() > limit) reduce('🏭 Industry: ', 10);
    if (wc() > limit) reduce('📜 Policy: ', 10);
    if (wc() > limit) reduce('War-Metal Signal: ', 10);
    if (wc() > limit) out = out.filter(x => !x.startsWith('#'));
    return out;
  };

  const buildCnHook = (raw, withLink=true) => {
    const lines = parseLines(raw || '');
    if (!lines.length) return '';

    let core = getField(lines, ['核心结论：', 'Conclusion:']);
    let policy = getField(lines, ['📜 政策：', '📜 Policy:']);
    let industry = getField(lines, ['🏭 产业：', '🏭 Industry:']);
    let capital = getField(lines, ['💰 资本：', '💰 Capital:']);
    const includes = getField(lines, ['报告包含：', 'Report includes:']);
    const evidence = getField(lines, ['证据锚点：', 'Evidence anchors:']);
    const link = getLink(raw);

    const fallbackFact = firstFact(includes) || firstFact(evidence) || '关注资金、政策与供应链三条线索。';

    core = clipCn(core || '所谓“战争金属”升温，先看风险阈值再行动。', 28);
    policy = clipCn(policy || fallbackFact, 32);
    industry = clipCn(industry || fallbackFact, 32);
    capital = clipCn(capital || fallbackFact, 32);

    if (similar(industry, policy)) industry = clipCn(firstFact(includes) || '供应链与产能结构正在重排。', 32);
    if (similar(capital, policy) || similar(capital, industry)) capital = clipCn(firstFact(evidence) || '资金流向将分化高低质量资产。', 32);

    let out = [
      `【战争金属信号】${core}`,
      '先看3点',
      `📜 政策：${policy}`,
      `🏭 产业：${industry}`,
      `💰 资本：${capital}`,
      '⚠️ 风险提示：不构成投资建议，请按风险承受能力决策。'
    ];

    out = enforceCn220(out, 220);

    if (withLink && link) out.push('', '👉 完整版：', link);
    out.push('私信回复【稀土】获取完整版', '#稀土 #关键矿产 #供应链');

    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  };

  const buildEnHook = (raw, withLink=true) => {
    const lines = parseLines(raw || '');
    if (!lines.length) return '';

    let core = getField(lines, ['Conclusion:', '核心结论：']);
    let policy = getField(lines, ['📜 Policy:', '📜 政策：']);
    let industry = getField(lines, ['🏭 Industry:', '🏭 产业：']);
    let capital = getField(lines, ['💰 Capital:', '💰 资本：']);
    const includes = getField(lines, ['Report includes:', '报告包含：']);
    const evidence = getField(lines, ['Evidence anchors:', '证据锚点：']);
    const link = getLink(raw);

    const fallbackFact = clipWords(firstFact(includes) || firstFact(evidence) || 'Track policy, supply chain, and capital flow triggers.', 14);

    core = clipWords(core || 'War-metal narratives are rising, but risk control matters first.', 12);
    policy = clipWords(policy || fallbackFact, 14);
    industry = clipWords(industry || fallbackFact, 14);
    capital = clipWords(capital || fallbackFact, 14);

    if (similar(industry, policy)) industry = clipWords(firstFact(includes) || 'Processing capacity and downstream bottlenecks are repricing.', 14);
    if (similar(capital, policy) || similar(capital, industry)) capital = clipWords(firstFact(evidence) || 'Funding and valuation are diverging across the chain.', 14);

    let out = [
      `War-Metal Signal: ${core}`,
      '3 things to watch:',
      `📜 Policy: ${policy}`,
      `🏭 Industry: ${industry}`,
      `💰 Capital: ${capital}`,
      '⚠️ Risk note: Not investment advice. Manage triggers and position size.'
    ];

    out = enforceEn120Words(out, 120);

    if (withLink && link) out.push('', 'Full brief:', link);
    out.push('DM for full report', '#RareEarth #CriticalMinerals #SupplyChain');
    return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  };

  const cnLink = document.getElementById('copy-cn-link');
  const cnDm = document.getElementById('copy-cn-dm');
  const enLink = document.getElementById('copy-en-link');
  const enDm = document.getElementById('copy-en-dm');

  if (cnLink) cnLink.value = buildCnHook(cnLink.value, true);
  if (cnDm) cnDm.value = buildCnHook(cnDm.value, false);
  if (enLink) enLink.value = buildEnHook(enLink.value, true);
  if (enDm) enDm.value = buildEnHook(enDm.value, false);

  const buttons = document.querySelectorAll('[data-copy]');
  const copyText = async (text) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    return false;
  };

  buttons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copy);
      const status = document.getElementById(btn.dataset.status);
      if (!target) return;

      const setStatus = (msg) => {
        if (!status) return;
        status.textContent = msg;
        setTimeout(() => { status.textContent = ''; }, 2000);
      };

      try {
        const ok = await copyText(target.value || '');
        if (ok) return setStatus('已复制');
      } catch (_) {}

      target.focus();
      target.select();
      try {
        document.execCommand('copy');
        setStatus('已复制');
      } catch (_) {
        setStatus('复制失败');
      }
    });
  });
})();
</script>
</body>
</html>
