<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 社媒文案</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1100px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.column{display:flex;flex-direction:column;gap:16px}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.section-title{font-weight:600;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted);margin-bottom:8px}
textarea{width:100%;min-height:240px;border:1px solid #e2e8f0;border-radius:10px;padding:10px;font-size:12px;line-height:1.5;color:#0b1220;resize:vertical;background:#f9fbff}
.actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-status{font-size:12px;color:var(--muted)}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 社媒文案</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/orders/">报告</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/admin/products/validate/">产品校验</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <div class="grid">
    <div class="column">
      <section class="section">
        <div class="section-title">中文外链版（引流）</div>
        <div class="meta">适合雪球 / 微博 / 公众号 · 钩子 + 风险提示 + 链接</div>
        <textarea id="copy-cn-link" readonly>{{SOCIAL_COPY_CN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-link" data-status="status-cn-link">复制外链版</button>
          <span class="copy-status" id="status-cn-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">中文私信版（引流）</div>
        <div class="meta">禁外链场景 · 钩子 + 风险提示 + 私信承接</div>
        <textarea id="copy-cn-dm" readonly>{{SOCIAL_COPY_CN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-cn-dm" data-status="status-cn-dm">复制私信版</button>
          <span class="copy-status" id="status-cn-dm"></span>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="section">
        <div class="section-title">English (Hook + Link)</div>
        <div class="meta">For LinkedIn / X · Hook + risk note + link</div>
        <textarea id="copy-en-link" readonly>{{SOCIAL_COPY_EN_LINK}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-link" data-status="status-en-link">Copy Link Version</button>
          <span class="copy-status" id="status-en-link"></span>
        </div>
      </section>

      <section class="section">
        <div class="section-title">English (Hook + DM)</div>
        <div class="meta">No link · short DM funnel version</div>
        <textarea id="copy-en-dm" readonly>{{SOCIAL_COPY_EN_DM}}</textarea>
        <div class="actions">
          <button class="btn primary" data-copy="copy-en-dm" data-status="status-en-dm">Copy DM Version</button>
          <span class="copy-status" id="status-en-dm"></span>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  const clean = (s='') => String(s || '')
    .replace(/\r/g, ' ')
    .replace(/\u00A0/g, ' ')
    .replace(/。\s*[；;]/g, '。')
    .replace(/([。！？!?])\s*[；;]/g, '$1')
    .replace(/\.\s*;/g, '.')
    .replace(/(?:\.\.\.|…)/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  const stripLineNoise = (s='') => clean(s)
    .replace(/\bTL\s*;\s*DR\s*:\s*/ig, '')
    .replace(/\bKey\s*angles?\s*:\s*/ig, '')
    .replace(/^\s*(要点|三视角|Three angles|Conclusion|核心结论|Report includes|Opportunity window|机会窗口)\s*[:：]?\s*/i, '')
    .replace(/^\s*[•\-\*\u2022]+\s*/g, '')
    .trim();

  const parseLabeledLine = (line='') => {
    const m = String(line || '').match(/^\s*([^:：]{2,30})[:：]\s*(.*)$/);
    if (!m) return null;
    return { label: m[1].trim(), body: clean(m[2] || '') };
  };

  const containsActionToken = (body='') => /(减持|增配|加仓|减仓|规避|回避|布局|配置|锁定|优先跟踪|trim|reduce|add|hedge|rotate|de-risk|buy|sell|overweight|underweight)/i.test(String(body || ''));

  const isActionBody = (body='') => {
    const b = String(body || '').replace(/^\d+\.\s*/, '').trim();
    if (!b) return false;
    if (/^(减持|增配|加仓|减仓|规避|回避|布局|配置|锁定|优先跟踪)/i.test(b)) return true;
    if (/^(trim|reduce|add|hedge|rotate|de-risk|buy|sell|overweight|underweight)\b/i.test(b)) return true;
    return containsActionToken(b);
  };

  const isRiskBody = (body='') => {
    const b = String(body || '').trim();
    return /^\d+\.\s*/.test(b) || /^(若|如果|if\b|unless\b)/i.test(b) || /概率\s*\d+%/.test(b) || /(回撤|下行|不及预期|volatility|pullback)/i.test(b);
  };

  const stripRiskNumbering = (s='') => {
    let t = clean(String(s || ''));
    t = t.replace(/(^|[；;])\s*\d+\.\s*/g, '$1');
    t = t.replace(/[；;]{2,}/g, '；').replace(/^；+/, '');
    return t.trim();
  };

  const normalizeStructured = (raw='') => {
    const t = String(raw || '');
    const lines = t.split('\n').map(x => x.trim()).filter(Boolean);
    if (!lines.length) return '';

    const out = [];
    for (const ln of lines) {
      const low = ln.toLowerCase();
      if (low.startsWith('tl;dr')) continue;
      if (/^https?:\/\//i.test(ln)) { out.push(ln); continue; }
      if (ln.startsWith('#')) { out.push(ln); continue; }
      out.push(stripLineNoise(ln));
    }

    const dedup = [];
    const seen = new Set();
    for (const ln of out) {
      const key = ln.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fff:]+/g,'');
      if (!key) continue;
      if (seen.has(key)) continue;
      seen.add(key);
      dedup.push(ln);
    }

    const merged = [];
    const appendToNearest = (re, text) => {
      for (let i = merged.length - 1; i >= 0; i--) {
        if (re.test(merged[i])) {
          if (!merged[i].includes(text)) {
            merged[i] = merged[i].replace(/[。；;]?\s*$/, '；') + text;
          }
          return true;
        }
      }
      return false;
    };

    for (const ln of dedup) {
      let line = String(ln || '').trim();
      if (!line) continue;

      const parsed = parseLabeledLine(line);
      const body = parsed ? parsed.body : line.replace(/^\d+\.\s*/, '').trim();
      const isAction = isActionBody(body);
      const isRisk = isRiskBody(body);
      const riskBody = isRisk ? stripRiskNumbering(body) : body;

      if (isAction && appendToNearest(/^(投资动作[:：]|Investor action[:：])/i, body)) continue;
      if (isRisk && appendToNearest(/^(反方风险[:：]|Counter-risk[:：])/i, riskBody)) continue;

      merged.push(line);
    }

    const labels = {};
    const extras = [];
    for (const ln of merged) {
      const parsed = parseLabeledLine(ln);
      if (!parsed) {
        extras.push(ln);
        continue;
      }
      if (!(parsed.label in labels)) {
        labels[parsed.label] = parsed.body;
      } else if (parsed.body && !labels[parsed.label].includes(parsed.body)) {
        labels[parsed.label] = clean(labels[parsed.label] + '；' + parsed.body);
      }
    }

    if (labels['影响路径'] && isRiskBody(labels['影响路径'])) {
      if (!labels['反方风险']) labels['反方风险'] = labels['影响路径'].replace(/^\d+\.\s*/, '').trim();
      labels['影响路径'] = '供应链重排速度提升，海外溢价与国内重估预期同步增强。';
    }
    if (labels['Impact path'] && isRiskBody(labels['Impact path'])) {
      if (!labels['Counter-risk']) labels['Counter-risk'] = labels['Impact path'].replace(/^\d+\.\s*/, '').trim();
      labels['Impact path'] = 'Supply-chain repricing is widening external premiums and domestic revaluation expectations.';
    }

    if (labels['证据锚点'] && (isActionBody(labels['证据锚点']) || containsActionToken(labels['证据锚点']))) {
      labels['证据锚点'] = labels['核心事实'] || labels['影响路径'] || '根据最新公开信息，供给不确定性仍在上升。';
    }
    if (labels['Evidence anchor'] && (isActionBody(labels['Evidence anchor']) || containsActionToken(labels['Evidence anchor']))) {
      labels['Evidence anchor'] = labels['Core fact'] || labels['Impact path'] || 'According to current public disclosures, supply uncertainty remains elevated.';
    }

    if (labels['反方风险']) labels['反方风险'] = stripRiskNumbering(labels['反方风险']);
    if (labels['Counter-risk']) labels['Counter-risk'] = stripRiskNumbering(labels['Counter-risk']);

    const zhOrder = ['核心事实','影响路径','投资动作','反方风险','证据锚点','⚠️ 风险提示'];
    const enOrder = ['Core fact','Impact path','Investor action','Counter-risk','Evidence anchor','⚠️ Risk note'];

    const rebuilt = [];
    const hasZh = zhOrder.some(k => labels[k]);
    const hasEn = enOrder.some(k => labels[k]);

    if (hasZh) {
      for (const k of zhOrder) {
        if (labels[k]) rebuilt.push(`${k}：${labels[k]}`);
      }
    } else if (hasEn) {
      for (const k of enOrder) {
        if (labels[k]) rebuilt.push(`${k}: ${labels[k]}`);
      }
    } else {
      rebuilt.push(...merged);
    }

    for (const e of extras) {
      if (!e) continue;
      if (!rebuilt.includes(e)) rebuilt.push(e);
    }

    return rebuilt.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  };

  try {
    const cnLink = document.getElementById('copy-cn-link');
    const cnDm = document.getElementById('copy-cn-dm');
    const enLink = document.getElementById('copy-en-link');
    const enDm = document.getElementById('copy-en-dm');

    if (cnLink) cnLink.value = normalizeStructured(cnLink.value);
    if (cnDm) cnDm.value = normalizeStructured(cnDm.value);
    if (enLink) enLink.value = normalizeStructured(enLink.value);
    if (enDm) enDm.value = normalizeStructured(enDm.value);
  } catch (e) {
    console.error('social copy normalize failed', e);
  }

  const buttons = document.querySelectorAll('[data-copy]');
  const copyText = async (text) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    return false;
  };

  buttons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copy);
      const status = document.getElementById(btn.dataset.status);
      if (!target) return;

      const setStatus = (msg) => {
        if (!status) return;
        status.textContent = msg;
        setTimeout(() => { status.textContent = ''; }, 2000);
      };

      try {
        const ok = await copyText(target.value || '');
        if (ok) return setStatus('已复制');
      } catch (_) {}

      target.focus();
      target.select();
      try {
        document.execCommand('copy');
        setStatus('已复制');
      } catch (_) {
        setStatus('复制失败');
      }
    });
  });
})();
</script>
</body>
</html>
