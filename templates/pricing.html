<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>产品与定价 · RareEarth Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f8fafc;--card:#fff;--accent:#1e3a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui}
.container{max-width:1100px;margin:0 auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.title{font-family:"Source Serif 4",serif;font-size:28px;font-weight:600;margin:0}
.meta{font-size:12px;color:var(--muted)}
.nav a{font-size:12px;color:var(--muted);text-decoration:none;margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.card h3{margin:0 0 8px 0;font-size:18px;font-family:"Source Serif 4",serif}
.price{font-size:24px;font-weight:600;color:var(--accent);margin:6px 0}
.desc{font-size:13px;color:var(--muted);min-height:40px}
.btn{display:inline-block;margin-top:10px;background:#111827;color:#fff;text-decoration:none;padding:7px 12px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<main class="container">
  <header class="top">
    <div>
      <h1 class="title">产品与定价</h1>
      <div class="meta">更新于 {{LAST_UPDATE}}</div>
    </div>
    <nav class="nav">
      <a href="/cn/">首页</a>
      <a href="/cn/premium/">Premium</a>
      <a href="/cn/weekly-pack/">周包</a>
      <a href="/cn/task/sprint/">任务</a>
      <a href="/en/pricing/">EN</a>
    </nav>
  </header>

  <section class="grid">
    {{PRICING_CARDS}}
  </section>
</main>
</body>
</html>
