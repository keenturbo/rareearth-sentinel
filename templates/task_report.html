<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>任务报告 | 稀土情报哨兵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f8f6f2;--card:#ffffff;--accent:#1e3a8a;--soft:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.container{max-width:980px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
header .title{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600}
.nav a{margin-left:12px;font-size:12px;color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
.section{background:var(--card);border-radius:10px;border:1px solid #e5e7eb;padding:16px;margin-bottom:12px}
.section-title{font-family:"Noto Serif SC",serif;font-weight:600;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted)}
.value{font-size:13px;margin-top:6px}
.summary{font-size:13px;margin-top:8px;line-height:1.7}
.task-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.task-table th,.task-table td{border:1px solid #e5e7eb;padding:6px 8px;text-align:left;vertical-align:top}
.task-table th{background:var(--soft);font-weight:600}
.source-list{margin:6px 0 0 0;padding-left:16px;font-size:12px;color:var(--muted)}
.source-list a{text-decoration:none;color:var(--accent)}
.source-list a:hover{text-decoration:underline}
.empty{font-size:12px;color:var(--muted)}
.share-bar{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.share-btn{width:28px;height:28px;border-radius:999px;border:1px solid #e5e7eb;display:inline-flex;align-items:center;justify-content:center;color:transparent;background:#fff;text-decoration:none;font-size:0;font-weight:600;background-repeat:no-repeat;background-position:center;background-size:14px 14px}
.share-btn:hover{border-color:#d1d5db}
.share-btn[data-share="x"]{background-image:url("https://simpleicons.org/icons/x.svg")}
.share-btn[data-share="linkedin"]{background-image:url("https://www.svgrepo.com/download/360538/linkedin-circle.svg");background-size:16px 16px}
.share-btn[data-share="reddit"]{background-image:url("https://simpleicons.org/icons/reddit.svg")}
.share-btn[data-share="telegram"]{background-image:url("https://simpleicons.org/icons/telegram.svg")}
.share-btn[data-share="weibo"]{background-image:url("https://simpleicons.org/icons/sinaweibo.svg")}
.share-btn[data-share="wechat"]{background-image:url("https://simpleicons.org/icons/wechat.svg")}
.share-btn[data-share="copy"]{background-image:url("https://www.svgrepo.com/download/535325/copy.svg");background-size:16px 16px}
.share-icon{display:none}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;font-size:12px;padding:6px 10px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:90}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e70b3b5596ee443690a85e4c19e6c15a"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<div class="container">
  <header>
    <div class="title">任务报告</div>
    <div class="nav">
      <a href="/cn/">返回首页</a>
      <a href="{{TASK_LINK}}">返回任务</a>
    </div>
  </header>

  <section class="section">
    <div class="section-title">报告信息</div>
    <div class="meta">任务ID：{{TASK_ID}}</div>
    <div class="value">报告日期：{{REPORT_DATE}}</div>
    <div class="value">关联报告：{{REPORT_TITLE}}</div>
    <div class="value">操作建议：{{TASK_SUGGESTION}}</div>
    <div class="share-bar" data-share-title="稀土情报哨兵 · 任务报告">
      <a class="share-btn" data-share="x" aria-label="Share on X" href="#"><span class="share-icon">X</span></a>
      <a class="share-btn" data-share="linkedin" aria-label="Share on LinkedIn" href="#"><span class="share-icon">in</span></a>
      <a class="share-btn" data-share="reddit" aria-label="Share on Reddit" href="#"><span class="share-icon">rd</span></a>
      <a class="share-btn" data-share="telegram" aria-label="Share on Telegram" href="#"><span class="share-icon">tg</span></a>
      <a class="share-btn" data-share="weibo" aria-label="Share on Weibo" href="#"><span class="share-icon">wb</span></a>
      <button class="share-btn" data-share="wechat" aria-label="Copy for WeChat" type="button"><span class="share-icon">wx</span></button>
      <button class="share-btn" data-share="copy" aria-label="Copy link" type="button"><span class="share-icon">cpy</span></button>
    </div>
  </section>

  <section class="section">
    <div class="section-title">本期结论</div>
    {{REPORT_SUMMARY}}
  </section>

  <section class="section">
    <div class="section-title">关键路径</div>
    {{ACTION_TABLE}}
  </section>

  <section class="section">
    <div class="section-title">证据来源</div>
    {{SOURCE_LIST}}
  </section>
</div>
<script>
(function(){
  function fallbackCopy(text){
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(textarea);
  }

  function copyText(text){
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){}, function(){ fallbackCopy(text); });
      return;
    }
    fallbackCopy(text);
  }

  function setupShareBar(bar, toastText){
    var url = bar.getAttribute('data-share-url') || window.location.href;
    var title = bar.getAttribute('data-share-title') || document.title;
    var encodedUrl = encodeURIComponent(url);
    var encodedTitle = encodeURIComponent(title);
    var toast = document.getElementById('share-toast');

    function showToast(){
      if (!toast) return;
      toast.textContent = toastText;
      toast.classList.add('show');
      if (toast._timer) clearTimeout(toast._timer);
      toast._timer = setTimeout(function(){ toast.classList.remove('show'); }, 1200);
    }

    bar.querySelectorAll('[data-share]').forEach(function(btn){
      var kind = btn.getAttribute('data-share');
      if (kind === 'copy' || kind === 'wechat') {
        btn.addEventListener('click', function(event){
          event.preventDefault();
          event.stopPropagation();
          copyText(url);
          showToast();
        });
        return;
      }
      var shareUrl = '';
      if (kind === 'x') {
        shareUrl = 'https://twitter.com/intent/tweet?text=' + encodedTitle + '&url=' + encodedUrl;
      } else if (kind === 'linkedin') {
        shareUrl = 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl;
      } else if (kind === 'reddit') {
        shareUrl = 'https://www.reddit.com/submit?url=' + encodedUrl + '&title=' + encodedTitle;
      } else if (kind === 'telegram') {
        shareUrl = 'https://t.me/share/url?url=' + encodedUrl + '&text=' + encodedTitle;
      } else if (kind === 'weibo') {
        shareUrl = 'https://service.weibo.com/share/share.php?url=' + encodedUrl + '&title=' + encodedTitle;
      }
      if (shareUrl) {
        btn.setAttribute('href', shareUrl);
        btn.setAttribute('target', '_blank');
        btn.setAttribute('rel', 'noopener');
      }
    });
  }

  var bars = document.querySelectorAll('.share-bar');
  if (!bars.length) return;
  bars.forEach(function(bar){
    setupShareBar(bar, '已复制');
  });
})();
</script>
<div class="toast" id="share-toast">已复制</div>
</body>
</html>
