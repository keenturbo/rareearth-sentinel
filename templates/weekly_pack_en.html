<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Pack · RareEarth Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f8fafc;--card:#fff;--accent:#1e3a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui}
.container{max-width:1100px;margin:0 auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.title{font-family:"Source Serif 4",serif;font-size:28px;margin:0}
.meta{font-size:12px;color:var(--muted)}
.nav a{font-size:12px;color:var(--muted);text-decoration:none;margin-left:10px}
.list{display:grid;gap:14px;margin-top:16px}
.card{background:var(--card);border:1px solid #e5e7eb;border-radius:12px;padding:14px}
.card h3{margin:0 0 6px 0;font-family:"Source Serif 4",serif}
.badge{font-size:12px;color:#1e3a8a;background:#eef2ff;border-radius:999px;padding:2px 8px;display:inline-block;margin-right:6px}
ul{margin:8px 0 0 18px;padding:0;font-size:13px;color:var(--muted)}
.btn{display:inline-block;margin-top:10px;background:#111827;color:#fff;text-decoration:none;padding:7px 12px;border-radius:999px;font-size:12px}
</style>
</head>
<body>
<main class="container" data-funnel-endpoint="{{FUNNEL_ENDPOINT}}" data-page-lang="{{PAGE_LANG}}" data-page-channel="{{PAGE_CHANNEL}}">
  <header class="top">
    <div>
      <h1 class="title">Weekly Pack (5 Reports)</h1>
      <div class="meta">Updated {{LAST_UPDATE}}</div>
    </div>
    <nav class="nav">
      <a href="/en/">Home</a>
      <a href="/en/pricing/">Pricing</a>
      <a href="/en/premium/">Premium</a>
      <a href="/cn/weekly-pack/">中文</a>
    </nav>
  </header>

  <section class="list">
    {{WEEKLY_PACK_LIST}}
  </section>
</main>
<script>
(function(){
  const root = document.querySelector('main.container');
  if(!root) return;
  const endpoint = root.dataset.funnelEndpoint || '';
  const pageLang = root.dataset.pageLang || 'en';
  const pageChannel = root.dataset.pageChannel || 'weekly_pack_page';
  if(!endpoint) return;

  function send(eventType, extra){
    const payload = Object.assign({
      event_type: eventType,
      lang: pageLang,
      channel: pageChannel,
      meta: { path: location.pathname }
    }, extra || {});

    try{
      const body = JSON.stringify(payload);
      if(navigator.sendBeacon){
        const blob = new Blob([body], {type:'application/json'});
        navigator.sendBeacon(endpoint, blob);
        return;
      }
      fetch(endpoint, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body,
        keepalive: true
      }).catch(()=>{});
    }catch(err){}
  }

  send('view_pricing');

  document.querySelectorAll('.funnel-pay-link').forEach(link => {
    link.addEventListener('click', () => {
      send('click_pay', {
        sku_id: link.dataset.skuId || '',
        channel: link.dataset.channel || pageChannel,
        meta: { href: link.getAttribute('href') || '' }
      });
    }, {passive:true});
  });
})();
</script>
</body>
</html>
