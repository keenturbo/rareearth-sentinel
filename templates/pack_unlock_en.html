<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Pack Delivery | RareEarth Sentinel</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f8fafc;--card:#fff;--line:#e5e7eb;--accent:#1e3a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.container{max-width:900px;margin:0 auto;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
h1{margin:0 0 8px 0;font-size:24px}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px}
ul{margin:0;padding-left:18px}
li{margin:8px 0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.notice{margin-top:12px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="container">
  <section class="card">
    <h1>{{PACK_TITLE}}</h1>
    <div class="meta">Order: {{ORDER_ID}} · Delivered at: {{DELIVERED_AT}}</div>
    <ul>
      {{REPORT_ITEMS}}
    </ul>
    <div class="notice">Note: This page is the weekly-pack delivery entry. Link validity follows unlock policy.</div>
  </section>
</main>
</body>
</html>
