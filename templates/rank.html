<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>排名 · 稀土情报哨兵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--accent:#1e3a8a;--bg:#f8fafc;--card:#ffffff;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);}
h1,h2{font-family:"Noto Serif SC","Noto Sans SC",sans-serif;}
.container{max-width:1100px;margin:0 auto;padding:32px 20px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.nav a{color:var(--muted);text-decoration:none;margin-left:12px;font-size:13px;}
.nav a:hover{color:var(--accent)}
.table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;}
.table th,.table td{border-bottom:1px solid #e5e7eb;padding:10px 12px;text-align:left;font-size:13px;}
.table th{background:#f9fafb;font-weight:600;}
.note{color:var(--muted);font-size:12px;}
</style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>排名</h1>
        <div class="note">独立方法论 + 可追溯证据（占位页面，后续填充数据）。</div>
      </div>
      <nav class="nav">
        <a href="/cn/">首页</a>
        <a href="/cn/about/">关于</a>
        <a href="/cn/subscribe/">订阅</a>
        <a href="/cn/rank/">排名</a>
        <a href="/cn/premium/">付费报告</a>
        <a href="/en/">English</a>
        <a class="gear" href="/cn/admin/premium/">⚙️</a>
      </nav>
    </header>

    <table class="table">
      <thead>
        <tr>
          <th>排名</th>
          <th>公司</th>
          <th>国家</th>
          <th>矿种</th>
          <th>总分</th>
        </tr>
      </thead>
      <tbody>
        {{RANK_TABLE}}
      </tbody>
    </table>
  </main>
</body>
</html>
