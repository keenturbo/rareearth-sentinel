<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>订阅方案 · 稀土情报哨兵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--accent:#1e3a8a;--bg:#f8fafc;--card:#ffffff;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);}
h1,h2{font-family:"Noto Serif SC","Noto Sans SC",sans-serif;}
.container{max-width:1100px;margin:0 auto;padding:32px 20px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.nav a{color:var(--muted);text-decoration:none;margin-left:12px;font-size:13px;}
.nav a:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px;}
.card{background:var(--card);border:1px solid #e5e7eb;border-radius:12px;padding:16px;}
.price{font-size:22px;font-weight:600;margin:8px 0;}
.note{color:var(--muted);font-size:12px;line-height:1.6;}
</style>
<!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e70b3b5596ee443690a85e4c19e6c15a"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>订阅方案</h1>
        <div class="note">订阅享受额度与折扣，单条报告仍可购买。</div>
      </div>
      <nav class="nav">
        <a href="/cn/">首页</a>
        <a href="/cn/about/">关于</a>
        <a href="/cn/subscribe/">订阅</a>
        <a href="/cn/rank/">排名</a>
        <a href="/cn/premium/">付费报告</a>
        <a href="/en/">English</a>
        <a class="gear" href="/cn/admin/premium/">⚙️</a>
      </nav>
    </header>

    <section class="grid">
      <div class="card">
        <h2>Essential</h2>
        <div class="price">$29 / 月</div>
        <div class="note">每月 6 次 $9 Brief，价格指数预警，单条折扣。</div>
      </div>
      <div class="card">
        <h2>Pro</h2>
        <div class="price">$99 / 月</div>
        <div class="note">每月 20 次 $9 Brief + 2 次 $99 折扣，任务监控（每周 1 个）。</div>
      </div>
      <div class="card">
        <h2>Institutional</h2>
        <div class="price">$499 / 月</div>
        <div class="note">无限 Brief，$99 折扣，$999 优先排期，任务监控（每日/触发）。</div>
      </div>
    </section>

    <section class="card" style="margin-top:16px;">
      <h2>单条购买</h2>
      <div class="note">仍可按 $9 / $99 / $999 单条解锁。</div>
    </section>
  </main>
</body>
</html>
