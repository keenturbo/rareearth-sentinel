<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ranking · RareEarth Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--accent:#1e3a8a;--bg:#f8fafc;--card:#ffffff;}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3",system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);}
h1,h2{font-family:"Source Serif 4","Source Sans 3",serif;}
.container{max-width:1100px;margin:0 auto;padding:32px 20px;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.nav a{color:var(--muted);text-decoration:none;margin-left:12px;font-size:13px;}
.nav a:hover{color:var(--accent)}
.table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;}
.table th,.table td{border-bottom:1px solid #e5e7eb;padding:10px 12px;text-align:left;font-size:13px;}
.table th{background:#f9fafb;font-weight:600;}
.note{color:var(--muted);font-size:12px;}
</style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Ranking</h1>
        <div class="note">Independent methodology + traceable evidence (placeholder; data will follow).</div>
      </div>
      <nav class="nav">
        <a href="/en/">Home</a>
        <a href="/en/about/">About</a>
        <a href="/en/subscribe/">Subscribe</a>
        <a href="/en/rank/">Ranking</a>
        <a href="/en/premium/">Premium</a>
        <a href="/cn/">中文</a>
        <a class="gear" href="/en/admin/premium/">⚙️</a>
      </nav>
    </header>

    <table class="table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Company</th>
          <th>Country</th>
          <th>Minerals</th>
          <th>Score</th>
        </tr>
      </thead>
      <tbody>
        {{RANK_TABLE}}
      </tbody>
    </table>
  </main>
</body>
</html>
