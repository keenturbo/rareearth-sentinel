<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Team Brief（月度服务）｜RareEarth Sentinel</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:980px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{margin:0;font-size:24px}
header .sub{font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05);margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{font-size:13px;padding:8px;border:1px solid #d1d5db;border-radius:8px;background:#fff}
textarea{min-height:120px;resize:vertical}
.btn{font-size:13px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;gap:8px;margin-top:10px}
.status{font-size:12px;color:var(--muted);margin-top:8px}
ul{margin:8px 0 0 18px;padding:0}
li{margin:4px 0}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>Team Brief（月度服务）</h1>
      <div class="sub">更新时间 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub"><a href="/cn/pricing/">返回产品页</a> · <a href="/cn/">返回首页</a></div>
  </header>

  <section class="card">
    <h2 style="margin:0 0 8px;font-size:18px">面向团队的关键矿产月度情报服务</h2>
    <p style="margin:0;color:#334155;font-size:14px;line-height:1.6">
      提供每月关键矿产风险综述、供应链变动与可执行行动建议。
      交付包含：月度总结、重点事件拆解、阈值清单、下月跟踪计划。
    </p>
    <ul>
      <li>覆盖对象：投资团队 / 采购团队 / 战略与合规团队</li>
      <li>服务价格：$399 起（按范围定制）</li>
      <li>交付方式：网页 + PDF + 邮件沟通</li>
    </ul>
  </section>

  <section class="card" id="lead-card" data-endpoint="{{TEAM_BRIEF_LEAD_ENDPOINT}}" data-lang="{{PAGE_LANG}}">
    <h2 style="margin:0 0 8px;font-size:18px">提交需求（获取报价）</h2>
    <div class="grid">
      <label>姓名
        <input id="name" placeholder="请输入姓名" />
      </label>
      <label>邮箱（必填）
        <input id="email" type="email" placeholder="name@company.com" />
      </label>
      <label>公司（必填）
        <input id="company" placeholder="公司名称" />
      </label>
      <label>职位
        <input id="role" placeholder="例如：采购经理 / 分析师" />
      </label>
      <label>国家/地区
        <input id="country_region" placeholder="CN / US / EU ..." />
      </label>
      <label>需求类型
        <select id="brief_need">
          <option value="market_risk">市场风险监测</option>
          <option value="policy_watch">政策追踪</option>
          <option value="supplier_mapping">供应商映射</option>
          <option value="custom">定制需求</option>
        </select>
      </label>
      <label>预算区间
        <select id="budget_range">
          <option value="lt_500">&lt; $500 / 月</option>
          <option value="500_2000">$500 - $2000 / 月</option>
          <option value="2000_plus">$2000+ / 月</option>
          <option value="unknown">待评估</option>
        </select>
      </label>
      <label>来源渠道
        <select id="source_channel">
          <option value="direct">direct</option>
          <option value="linkedin">linkedin</option>
          <option value="x">x</option>
          <option value="xueqiu">xueqiu</option>
          <option value="wechat">wechat</option>
          <option value="telegram">telegram</option>
          <option value="other">other</option>
        </select>
      </label>
    </div>
    <label style="margin-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:#536170">需求说明（必填）
      <textarea id="message" placeholder="请描述你们希望跟踪的主题、覆盖范围、更新频率等"></textarea>
    </label>
    <input id="utm_source" type="hidden" />
    <input id="utm_campaign" type="hidden" />
    <input id="utm_content" type="hidden" />
    <input id="website" type="hidden" />

    <div class="actions">
      <button id="submit" class="btn primary">提交需求</button>
      <button id="reset" class="btn" type="button">清空</button>
    </div>
    <div class="status" id="status">提交后我们会尽快联系你。</div>
  </section>
</div>

<script>
(function(){
  const card = document.getElementById('lead-card');
  if (!card) return;
  const endpoint = card.dataset.endpoint || '/api/lead/team-brief';
  const lang = card.dataset.lang || 'cn';

  const $ = (id) => document.getElementById(id);
  const status = $('status');
  const setStatus = (msg) => { if (status) status.textContent = msg; };

  const qs = new URLSearchParams(window.location.search || '');
  $('utm_source').value = qs.get('utm_source') || '';
  $('utm_campaign').value = qs.get('utm_campaign') || '';
  $('utm_content').value = qs.get('utm_content') || '';

  const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim());

  const readPayload = () => ({
    name: $('name').value.trim(),
    email: $('email').value.trim(),
    company: $('company').value.trim(),
    role: $('role').value.trim(),
    country_region: $('country_region').value.trim(),
    brief_need: $('brief_need').value,
    budget_range: $('budget_range').value,
    source_channel: $('source_channel').value,
    message: $('message').value.trim(),
    utm_source: $('utm_source').value || '',
    utm_campaign: $('utm_campaign').value || '',
    utm_content: $('utm_content').value || '',
    lang,
    website: $('website').value || ''
  });

  const resetForm = () => {
    ['name','email','company','role','country_region','message'].forEach((id)=>{ $(id).value=''; });
    $('brief_need').value = 'market_risk';
    $('budget_range').value = 'unknown';
    $('source_channel').value = 'direct';
  };

  $('reset').addEventListener('click', resetForm);

  $('submit').addEventListener('click', async () => {
    const btn = $('submit');
    const payload = readPayload();

    if (!payload.email || !emailOk(payload.email)) {
      setStatus('请填写有效邮箱');
      return;
    }
    if (!payload.company) {
      setStatus('请填写公司名称');
      return;
    }
    if (!payload.message) {
      setStatus('请填写需求说明');
      return;
    }

    btn.disabled = true;
    setStatus('提交中...');

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = res.ok ? await res.json() : null;
      if (data && data.ok) {
        setStatus('提交成功，我们会尽快联系你。');
        resetForm();
      } else {
        setStatus((data && data.error) ? `提交失败：${data.error}` : '提交失败，请稍后重试');
      }
    } catch (e) {
      setStatus('提交失败，请稍后重试');
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
