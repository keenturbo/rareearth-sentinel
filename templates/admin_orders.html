<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 订单确认</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f8f6f2;--card:#ffffff;--accent:#1e3a8a;--good:#065f46}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
.container{max-width:980px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
header h1{font-family:"Noto Serif SC",serif;margin:0;font-size:22px}
header .meta{font-size:12px;color:var(--muted)}
.section{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stats{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;color:#374151}
.filter-btn.active{border-color:#1e3a8a;color:#1e3a8a;background:#eff6ff}
.card{border-top:1px solid #eef2f7;padding-top:12px;margin-top:12px}
.card.hidden{display:none}
.card-title{font-weight:600;margin-bottom:4px}
.card-meta{font-size:12px;color:var(--muted);margin-bottom:6px}
.card-actions a{display:inline-block;margin-right:10px;font-size:12px;color:var(--accent);text-decoration:none}
.card-actions a:hover{text-decoration:underline}
.empty{font-size:12px;color:var(--muted)}
.card-confirm{margin-top:8px}
.confirm-btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.confirm-btn:hover{background:#f9fafb}
.confirmed{font-size:12px;color:var(--good)}
.unlock-link{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 订单确认</h1>
      <div class="meta">总数 {{TOTAL_COUNT}} · 更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="meta"><a href="/cn/admin/premium/">报告列表</a> · <a href="/cn/admin/task-orders/">任务订单</a> · <a href="/cn/admin/social/">社媒</a> · <a href="/cn/admin/products/validate/">产品校验</a> · <a href="/cn/admin/leads/team-brief/">Team Brief线索</a> · <a href="/cn/admin/funnel/">漏斗</a></div>
  </header>

  <section class="section" data-confirm-endpoint="{{CONFIRM_ENDPOINT}}">
    <div class="toolbar">
      <div class="stats" id="orderStats">统计中...</div>
      <div class="filters">
        <button type="button" class="filter-btn active" data-order-filter="all">全部</button>
        <button type="button" class="filter-btn" data-order-filter="weekly_pack">weekly_pack</button>
        <button type="button" class="filter-btn" data-order-filter="weekly_pack_delivered">weekly_pack 已交付</button>
      </div>
    </div>
    {{ORDERS_LIST}}
  </section>
</div>
<script>
(function(){
  const section = document.querySelector('.section');
  if (!section) return;
  const endpoint = section.dataset.confirmEndpoint || '';

  function cards(){
    return Array.from(section.querySelectorAll('.card'));
  }

  function isWeeklyPackCard(card){
    const t = (card.textContent || '').toLowerCase();
    const unlockHref = card.querySelector('.unlock-link a')?.getAttribute('href') || '';
    const actionHrefs = Array.from(card.querySelectorAll('.card-actions a')).map(a => a.getAttribute('href') || '').join(' ');
    return (
      t.includes('weekly_pack') ||
      t.includes('weekly pack') ||
      unlockHref.includes('/pack/unlock/') ||
      actionHrefs.includes('/pack/pay/') ||
      t.includes('pack_id')
    );
  }

  function isDeliveredPackCard(card){
    const t = (card.textContent || '').toLowerCase();
    const unlockHref = card.querySelector('.unlock-link a')?.getAttribute('href') || '';
    return unlockHref.includes('/pack/unlock/') || t.includes('fulfillment_status') && t.includes('delivered');
  }

  function updateStats(){
    const all = cards();
    const weekly = all.filter(isWeeklyPackCard);
    const delivered = weekly.filter(isDeliveredPackCard);
    const stats = section.querySelector('#orderStats');
    if (!stats) return;
    stats.textContent = `订单 ${all.length} · weekly_pack ${weekly.length} · 已交付 ${delivered.length}`;
  }

  function applyFilter(mode){
    cards().forEach(card => {
      let visible = true;
      if (mode === 'weekly_pack') visible = isWeeklyPackCard(card);
      if (mode === 'weekly_pack_delivered') visible = isWeeklyPackCard(card) && isDeliveredPackCard(card);
      card.classList.toggle('hidden', !visible);
    });
    section.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.orderFilter === mode);
    });
  }

  section.addEventListener('click', async (e) => {
    const filterBtn = e.target.closest('.filter-btn');
    if (filterBtn) {
      applyFilter(filterBtn.dataset.orderFilter || 'all');
      return;
    }

    const btn = e.target.closest('.confirm-btn');
    if (!btn) return;
    if (!endpoint) return;

    const orderId = btn.getAttribute('data-order-id');
    const reportId = btn.getAttribute('data-report-id');
    const tier = btn.getAttribute('data-tier') || '$9';
    const lang = btn.getAttribute('data-lang') || 'cn';
    if (!orderId || !reportId) return;

    btn.textContent = '确认中...';
    btn.disabled = true;

    try {
      const url = `${endpoint}?order_id=${encodeURIComponent(orderId)}&report_id=${encodeURIComponent(reportId)}&tier=${encodeURIComponent(tier)}&lang=${encodeURIComponent(lang)}`;
      const res = await fetch(url, { method: 'GET' });
      const data = res.ok ? await res.json() : null;
      if (data && data.ok) {
        const card = btn.closest('.card');
        if (card) {
          const unlock = card.querySelector('.unlock-link');
          if (unlock && data.unlock_url) {
            unlock.innerHTML = `<a href="${data.unlock_url}" target="_blank">${data.unlock_url}</a>`;
          }
          const confirmWrap = card.querySelector('.card-confirm');
          if (confirmWrap) {
            confirmWrap.innerHTML = '<span class="confirmed">已确认</span>';
          }
        }
        updateStats();
      } else {
        btn.textContent = '确认失败';
        btn.disabled = false;
      }
    } catch (err) {
      btn.textContent = '确认失败';
      btn.disabled = false;
    }
  });

  updateStats();
  applyFilter('all');
})();
</script>
</body>
</html>
