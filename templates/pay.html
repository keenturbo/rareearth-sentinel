<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>解锁深度报告 | 稀土情报哨兵</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#111827;--muted:#6b7280;--bg:#f8f6f2;--card:#ffffff;--accent:#1e3a8a;--warn:#b45309;--soft:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.container{max-width:980px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
header .title{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:600}
.nav a{margin-left:12px;font-size:12px;color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
.section{background:var(--card);border-radius:10px;border:1px solid #e5e7eb;padding:16px;margin-bottom:12px}
.section-title{font-family:"Noto Serif SC",serif;font-weight:600;margin-bottom:8px}
.meta{font-size:12px;color:var(--muted)}
.value{font-size:13px;margin-top:6px}
.preview-list{margin:8px 0 0 0;padding:0;list-style:none}
.preview-item{padding:6px 0;border-bottom:1px dashed #e5e7eb;font-size:13px}
.preview-item:last-child{border-bottom:none}
.preview-label{display:inline-block;min-width:72px;color:var(--muted)}
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px}
.pay-card{border:1px solid #e5e7eb;border-radius:10px;padding:12px;background:#fff}
.pay-card img{max-width:100%;border-radius:8px;border:1px solid #e5e7eb}
.pay-title{font-size:12px;color:var(--muted);margin-bottom:6px}
.copy{font-size:12px;background:var(--soft);padding:6px;border-radius:8px;word-break:break-all}
.pay-note{font-size:12px;color:var(--muted);margin-top:10px}
.pay-btn{display:inline-block;margin-top:10px;font-size:12px;color:#fff;background:var(--warn);padding:6px 14px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.pay-btn:hover{background:#92400e}
.unlock-box{margin-top:10px;font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px}
.order-box{margin-top:10px;font-size:12px;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px}
.copy-btn{margin-left:6px;font-size:11px;border:1px solid #e5e7eb;background:#fff;border-radius:6px;padding:2px 6px;cursor:pointer}
.copy-btn:hover{background:#f9fafb}
.pay-field{margin-top:10px;font-size:12px}
.pay-field label{display:block;margin-bottom:4px;color:var(--muted)}
.pay-input{width:100%;padding:6px 8px;border:1px solid #e5e7eb;border-radius:8px;font-size:12px;background:#fff}
.report-body h1,.report-body h2,.report-body h3{font-family:"Noto Serif SC",serif;margin:12px 0 6px}
.report-body p{margin:6px 0}
.report-body ul{margin:6px 0 6px 16px}
</style>
</head>
<body>
<div class="container" data-report-id="{{REPORT_ID}}" data-confirm-endpoint="{{PAY_CONFIRM_ENDPOINT}}">
  <header>
    <div class="title">解锁深度报告</div>
    <div class="nav">
      <a href="/cn/">返回首页</a>
      <a href="/cn/premium/">历史报告</a>
      <a href="/en/pay/{{REPORT_ID}}.html">English</a>
    </div>
  </header>

  <section class="section">
    <div class="section-title">报告信息</div>
    <div class="meta">报告ID：{{REPORT_ID}}</div>
    <div class="value">{{REPORT_TITLE}}</div>
    <div class="value">价值：{{REPORT_VALUE}}</div>
  </section>

  <section class="section">
    <div class="section-title">公开预览（$9）</div>
    {{REPORT_PREVIEW}}
    <div class="meta">完整内容需付费解锁</div>
  </section>

  <section class="section" id="payment-section">
    <div class="section-title">解锁方式（仅开放 $9）</div>
    {{PAYMENT_SECTION}}

    <div class="pay-field">
      <label for="pay-method">付款方式</label>
      <select id="pay-method" class="pay-input">
        <option value="wechat">微信</option>
        <option value="alipay">支付宝</option>
        <option value="alipay_token">支付宝口令</option>
        <option value="usdt">USDT(TRC20)</option>
      </select>
    </div>

    <div class="pay-field">
      <label for="alipay-token">支付宝口令（买家填写）</label>
      <input id="alipay-token" class="pay-input" placeholder="输入你的支付宝口令" />
    </div>

    <div class="pay-field">
      <label for="buyer-email">邮箱（用于联系）</label>
      <input id="buyer-email" class="pay-input" placeholder="填写你的邮箱" />
    </div>

    <div class="order-box">
      <div>订单号：<span id="order-id" class="mono">--</span><button class="copy-btn" data-copy="order-id">复制</button></div>
      <div>付款备注：<span id="pay-memo" class="mono">report_id={{REPORT_ID}} tier=$9 order_id=-- email=你的邮箱</span><button class="copy-btn" data-copy="pay-memo">复制</button></div>
    </div>
    <div class="pay-note">付款时请务必填写备注，否则无法自动确认。</div>
    <button class="pay-btn" id="paid-btn">我已付款</button>
    <div class="unlock-box" id="unlock-box">解锁链接：等待确认</div>
  </section>

  <section class="section" id="full-report" style="display:none">
    <div class="section-title">完整报告</div>
    <div class="report-body" id="full-content"></div>
    <div class="meta">链接有效期 7 天，请妥善保存。</div>
  </section>
</div>
<script>
(function(){
  const container = document.querySelector(".container");
  const reportId = container ? container.dataset.reportId : "";
  const confirmEndpoint = container ? container.dataset.confirmEndpoint : "";
  const lang = "cn";
  const storageKey = `order_id:${reportId}`;
  let orderId = localStorage.getItem(storageKey);
  if (!orderId) {
    const rand = Math.random().toString(36).slice(2, 8).toUpperCase();
    orderId = `RE-${Date.now().toString(36).toUpperCase()}-${rand}`;
    localStorage.setItem(storageKey, orderId);
  }

  const orderEl = document.getElementById("order-id");
  const memoEl = document.getElementById("pay-memo");
  const emailInput = document.getElementById("buyer-email");
  const tokenInput = document.getElementById("alipay-token");
  const methodSelect = document.getElementById("pay-method");
  const unlockBox = document.getElementById("unlock-box");
  const paidBtn = document.getElementById("paid-btn");
  const fullReport = document.getElementById("full-report");
  const fullContent = document.getElementById("full-content");

  if (orderEl) orderEl.textContent = orderId;

  function updateMemo(){
    const emailVal = (emailInput && emailInput.value.trim()) || "你的邮箱";
    if (memoEl) memoEl.textContent = `report_id=${reportId} tier=$9 order_id=${orderId} email=${emailVal}`;
  }

  updateMemo();
  if (emailInput) {
    emailInput.addEventListener("input", updateMemo);
  }

  document.querySelectorAll(".copy-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const targetId = btn.getAttribute("data-copy");
      const target = document.getElementById(targetId);
      if (!target) return;
      const text = target.textContent || "";
      if (!text) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
      }
      btn.textContent = "已复制";
      setTimeout(() => { btn.textContent = "复制"; }, 1200);
    });
  });

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function mdToHtml(md){
    if (!md) return "";
    const lines = md.split(/\r?\n/);
    let out = "";
    let inList = false;
    const closeList = () => {
      if (inList) {
        out += "</ul>";
        inList = false;
      }
    };
    for (const raw of lines) {
      const line = raw.replace(/\s+$/, "");
      if (!line.trim()) {
        closeList();
        continue;
      }
      if (line.startsWith("### ")) {
        closeList();
        out += `<h3>${escapeHtml(line.slice(4))}</h3>`;
        continue;
      }
      if (line.startsWith("## ")) {
        closeList();
        out += `<h2>${escapeHtml(line.slice(3))}</h2>`;
        continue;
      }
      if (line.startsWith("# ")) {
        closeList();
        out += `<h1>${escapeHtml(line.slice(2))}</h1>`;
        continue;
      }
      if (line.startsWith("- ")) {
        if (!inList) {
          out += "<ul>";
          inList = true;
        }
        out += `<li>${escapeHtml(line.slice(2))}</li>`;
        continue;
      }
      closeList();
      out += `<p>${escapeHtml(line)}</p>`;
    }
    closeList();
    return out;
  }

  function renderFull(content){
    if (fullContent) {
      fullContent.innerHTML = mdToHtml(content) || "<div class=\"meta\">无内容</div>";
    }
    if (fullReport) {
      fullReport.style.display = "block";
    }
  }

  async function fetchUnlock(token, forceLink){
    if (!token) return false;
    try {
      const res = await fetch(`/unlocks/${token}.json?ts=${Date.now()}`);
      if (!res.ok) return false;
      const data = await res.json();
      if (!data || data.report_id !== reportId) return false;
      if (data.expires_at) {
        const exp = new Date(data.expires_at);
        if (!Number.isNaN(exp.getTime()) && exp.getTime() < Date.now()) {
          if (unlockBox) unlockBox.textContent = "链接已过期，请联系续期";
          return false;
        }
      }
      const url = `/${lang}/pay/${reportId}.html?unlock=${token}`;
      if (unlockBox) {
        unlockBox.innerHTML = `解锁链接：<a href="${url}" target="_blank">${url}</a>`;
      }
      renderFull(data.content_md || "");
      return true;
    } catch (err) {
      return false;
    }
  }

  if (paidBtn) {
    paidBtn.addEventListener("click", async () => {
      if (unlockBox) {
        unlockBox.textContent = "已提交付款信息，请等待确认…";
      }
      if (!confirmEndpoint) {
        return;
      }
      try {
        const payload = {
          report_id: reportId,
          order_id: orderId,
          tier: "$9",
          lang: "cn",
          email: (emailInput && emailInput.value.trim()) || "",
          payment_method: methodSelect ? methodSelect.value : "",
          payment_token: (tokenInput && tokenInput.value.trim()) || "",
          memo: memoEl ? memoEl.textContent : "",
        };
        const res = await fetch(confirmEndpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok && unlockBox) {
          unlockBox.textContent = "提交失败，请稍后重试";
        }
      } catch (err) {
        if (unlockBox) {
          unlockBox.textContent = "提交失败，请稍后重试";
        }
      }
    });
  }

  async function pollStatus(){
    if (!orderId) return;
    try {
      const res = await fetch(`/pay/status/${orderId}.json?ts=${Date.now()}`);
      if (!res.ok) return;
      const data = await res.json();
      if (!data || data.report_id !== reportId) return;
      const token = data.token || "";
      if (token) {
        await fetchUnlock(token, true);
      }
    } catch (err) {
      // ignore
    }
  }

  const params = new URLSearchParams(window.location.search);
  const unlockToken = params.get("unlock");
  if (unlockToken) {
    fetchUnlock(unlockToken, true);
  }

  pollStatus();
  setInterval(pollStatus, 5000);
})();
</script>
</body>
</html>
