<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 产品校验</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8;--ok:#065f46;--warn:#92400e;--bad:#991b1b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1080px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{display:inline-block;font-size:12px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#1e3a8a}
.pill.pass{background:#ecfdf3;color:var(--ok)}
.pill.warn{background:#fff7ed;color:var(--warn)}
.pill.fail{background:#fef2f2;color:var(--bad)}
.path{font-size:12px;color:var(--muted);margin:4px 0;word-break:break-all}
.item{border-top:1px solid #eef2f7;padding-top:12px;margin-top:12px}
.item-title{font-weight:600;margin-bottom:4px}
.item-detail{font-size:13px;color:#1f2937;word-break:break-word}
.suggest{font-size:12px;color:var(--muted);margin-top:6px}
.item.pass .item-title{color:var(--ok)}
.item.warn .item-title{color:var(--warn)}
.item.fail .item-title{color:var(--bad)}
.empty{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 产品校验</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/premium/">报告</a>
      <span>·</span>
      <a href="/cn/admin/orders/">订单</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <section class="section">
    <div class="summary">{{VALIDATION_SUMMARY}}</div>
    <div class="path">catalog: {{PATH_CATALOG}}</div>
    <div class="path">packs: {{PATH_PACKS}}</div>
    <div class="path">reports: {{PATH_REPORTS}}</div>
    {{VALIDATION_LIST}}
  </section>
</div>
</body>
</html>
