<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>深度报告 · 管理员</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:900px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.section{background:#fff;border-radius:12px;padding:14px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:10px}
.meta-item{background:#f8fafc;border-radius:8px;padding:10px;font-size:12px;color:var(--muted)}
.meta-item span{color:#111;font-weight:600}
.meta-row{display:flex;gap:6px;align-items:center}
.meta-url{min-width:0;flex:1}
.meta-url a{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
.report-body h1{font-size:18px}
.report-body h2{font-size:16px;margin-top:12px}
.report-body h3{font-size:14px;margin-top:10px}
.report-body ul{margin:6px 0 0 18px;font-size:13px;color:var(--muted)}
.report-body p{font-size:13px;color:#111;line-height:1.5}
.back a{text-decoration:none;color:var(--accent);font-size:12px}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>{{REPORT_TITLE}}</h1>
      <div class="sub">报告ID：{{REPORT_ID}}</div>
    </div>
    <div class="back"><a href="{{BACK_LINK}}">返回列表</a></div>
  </header>

  <section class="section">
    <div class="meta-grid">
      <div class="meta-item">日期：<span>{{REPORT_DATE}}</span></div>
      <div class="meta-item">价格：<span>${{REPORT_PRICE}}</span></div>
      <div class="meta-item">可信度：<span>{{REPORT_CREDIBILITY}}</span></div>
      <div class="meta-item">影响评分：<span>{{REPORT_IMPACT}}</span></div>
      <div class="meta-item">
        <div class="meta-row"><span class="meta-label">来源：</span><span class="meta-url">{{REPORT_URL}}</span></div>
      </div>
    </div>
    <div class="report-body">
      {{REPORT_BODY}}
    </div>
  </section>
</div>
</body>
</html>
