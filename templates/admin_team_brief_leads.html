<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · Team Brief 线索</title>
<style>
:root{--ink:#0b1220;--muted:#536170;--bg:#f7f9fc;--card:#ffffff;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
.container{max-width:1200px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{margin:0;font-size:20px}
header .sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{text-decoration:none;color:var(--muted)}
.header-links a:hover{color:var(--accent)}
.section{background:#fff;border-radius:12px;padding:16px;box-shadow:0 6px 14px rgba(0,0,0,0.05)}
.path{font-size:12px;color:var(--muted);margin-bottom:10px;word-break:break-all}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-top:1px solid #eef2f7;padding:8px;text-align:left;vertical-align:top}
th{background:#f8fafc;color:#334155;white-space:nowrap}
.muted{color:#6b7280}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · Team Brief 线索</h1>
      <div class="sub">总数 {{TOTAL_COUNT}} · 更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/premium/">报告</a>
      <span>·</span>
      <a href="/cn/admin/orders/">订单</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/admin/leads/team-brief/">Team Brief线索</a>
      <span>·</span>
      <a href="/cn/admin/products/validate/">产品校验</a>
      <span>·</span>
      <a href="/cn/admin/funnel/">漏斗</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <section class="section">
    <div class="path">leads: {{LEADS_PATH}}</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>提交时间</th>
            <th>线索ID / 状态</th>
            <th>联系人</th>
            <th>公司 / 职位</th>
            <th>需求 / 预算</th>
            <th>来源 / UTM</th>
            <th>需求说明</th>
          </tr>
        </thead>
        <tbody>
          {{LEADS_ROWS}}
        </tbody>
      </table>
    </div>
  </section>
</div>
</body>
</html>
