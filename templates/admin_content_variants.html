<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理员 · 三版本草稿</title>
<style>
:root{--ink:#0b1220;--muted:#5b6675;--bg:#f5f7fb;--card:#ffffff;--accent:#1d4ed8;--ok:#15803d;--warn:#b45309;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:linear-gradient(180deg,#f7f9fc,#e9eef5);color:var(--ink)}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:1400px;margin:0 auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
header h1{margin:0;font-size:22px}
.sub{font-size:12px;color:var(--muted)}
.header-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;text-align:right}
.header-links a{color:var(--muted);text-decoration:none}
.header-links a:hover{color:var(--accent)}
.summary-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.summary-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--muted)}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 8px 18px rgba(0,0,0,0.06);margin-bottom:18px}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card-title{font-size:18px;font-weight:700;margin-bottom:6px}
.card-meta{font-size:12px;color:var(--muted);margin-top:3px}
.card-status{display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:600}
.badge.ok{background:#dcfce7;color:var(--ok)}
.badge.warn{background:#fef3c7;color:var(--warn)}
.inline-reason{font-size:12px;color:var(--muted)}
.source-pack{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.source-col{background:#f8fbff;border:1px solid #dbe6f6;border-radius:12px;padding:14px}
.block-title{font-size:13px;font-weight:700;margin:10px 0 6px}
.block-title:first-child{margin-top:0}
.block-text{font-size:13px;line-height:1.65;white-space:pre-wrap;color:#111827}
ul{margin:6px 0 10px 18px;padding:0}
li{font-size:13px;line-height:1.6;margin:4px 0}
.variants-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.variant-box{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfdff}
.variant-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.variant-title{font-weight:700;font-size:14px}
.variant-subtitle{margin-bottom:8px}
textarea{width:100%;min-height:300px;border:1px solid #dbe2ea;border-radius:10px;padding:10px;font-size:12px;line-height:1.6;color:#0b1220;background:#fff;resize:vertical;white-space:pre-wrap}
.actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.btn{font-size:12px;border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.copy-status{font-size:12px;color:var(--muted)}
.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
@media(max-width:1180px){.variants-grid{grid-template-columns:1fr}.source-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>管理员 · 三版本草稿</h1>
      <div class="sub">更新 {{LAST_UPDATE}}</div>
    </div>
    <div class="sub header-links">
      <a href="/cn/admin/orders/">报告</a>
      <span>·</span>
      <a href="/cn/admin/task-orders/">任务</a>
      <span>·</span>
      <a href="/cn/admin/social/">社媒</a>
      <span>·</span>
      <a href="/cn/admin/content-variants/">三版本草稿</a>
      <span>·</span>
      <a href="/cn/admin/premium/">付费简报</a>
      <span>·</span>
      <a href="/cn/admin/indices/">价格</a>
      <span>·</span>
      <a href="/cn/admin/keywords/">关键词</a>
      <span>·</span>
      <a href="/cn/">返回中文首页</a>
    </div>
  </header>

  <div class="summary-bar">
    <div class="summary-chip">总条数 {{TOTAL_COUNT}}</div>
    <div class="summary-chip">说明：仅供管理员审核与复制，不自动外发</div>
  </div>

  {{VARIANTS_LIST}}
</div>
<script>
(function(){
  const buttons = document.querySelectorAll('[data-copy]');
  const copyText = async (text) => {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
    return false;
  };

  buttons.forEach((btn) => {
    btn.addEventListener('click', async () => {
      const target = document.getElementById(btn.dataset.copy);
      const status = document.getElementById(btn.dataset.status);
      if (!target) return;

      const setStatus = (msg) => {
        if (!status) return;
        status.textContent = msg;
        setTimeout(() => { status.textContent = ''; }, 2000);
      };

      try {
        const ok = await copyText(target.value || '');
        if (ok) return setStatus('已复制');
      } catch (_) {}

      target.focus();
      target.select();
      try {
        document.execCommand('copy');
        setStatus('已复制');
      } catch (_) {
        setStatus('复制失败');
      }
    });
  });
})();
</script>
</body>
</html>
